services:
  nexus:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: nexus:local-verified
    restart: unless-stopped
    environment:
      NEXUS_API_TOKEN: ${NEXUS_API_TOKEN:?NEXUS_API_TOKEN is required}
      NEXUS_DATA_DIR: /data
      NEXUS_BIND_ADDR: 0.0.0.0:3000
    volumes:
      - ${NEXUS_DATA_DIR_HOST:-/var/lib/nexus}:/data
    ports:
      - "127.0.0.1:3000:3000"

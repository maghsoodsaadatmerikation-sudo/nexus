services:
  nexus:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: nexus:v1.1-candidate
    restart: unless-stopped
    environment:
      NEXUS_API_TOKEN: ${NEXUS_API_TOKEN:?NEXUS_API_TOKEN is required}
      NEXUS_DATA_DIR: /data
      NEXUS_BIND_ADDR: 0.0.0.0:3000
    volumes:
      - ${NEXUS_DATA_DIR_HOST:-/var/lib/nexus}:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/3000; printf \\\"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\\\" >&3; grep -q \\\"200 OK\\\" <&3'"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

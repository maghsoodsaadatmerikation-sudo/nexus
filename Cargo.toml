[package]
name = "nexus-constitutional-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "nexus_constitutional_core"
path = "src/lib.rs"

[dependencies]
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Keep the test harness compatible with the repository's pinned Rust 1.85 toolchain.
trybuild = "=1.0.116"

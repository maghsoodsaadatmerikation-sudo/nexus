plugins { id 'com.android.application' }

android {
    namespace 'org.nexus.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'org.nexus.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-debug'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // Deliberately unsigned. No production keystore or auto-publishing.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE']
        }
    }
}

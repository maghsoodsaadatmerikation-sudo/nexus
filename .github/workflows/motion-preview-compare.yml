name: NEXUS Motion Local MP4-to-Canvas Comparison Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/motion-preview-compare.yml'
      - 'web/motion-core.js'
      - 'web/motion-ui.js'
      - 'web/motion.html'
      - 'scripts/test-nexus-motion-core.mjs'
      - 'scripts/test-nexus-motion-compare-browser.py'
      - 'docs/NEXUS-MOTION-LOCAL-MP4-COMPARISON.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/motion-preview-compare.yml'
      - 'web/motion-core.js'
      - 'web/motion-ui.js'
      - 'web/motion.html'
      - 'scripts/test-nexus-motion-core.mjs'
      - 'scripts/test-nexus-motion-compare-browser.py'
      - 'docs/NEXUS-MOTION-LOCAL-MP4-COMPARISON.md'

permissions:
  contents: read

jobs:
  deterministic-pixel-contract:
    name: bounded-frame-difference-pure-javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact read-only candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify standalone pixel and sample frame math
        run: |
          set -euo pipefail
          node --check web/motion-core.js
          node --check web/motion-ui.js
          node scripts/test-nexus-motion-core.mjs
          python3 -m py_compile scripts/test-nexus-motion-compare-browser.py

  actual-local-mp4-browser-comparison:
    name: actual-local-h264-decode-and-three-frame-preview-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact read-only candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install FFmpeg only if missing
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
      - name: Compare actual H.264 MP4 and Canvas in private Chromium
        run: |
          set -euo pipefail
          python3 scripts/test-nexus-motion-compare-browser.py
      - name: Public deployment and uploads remain unverified
        run: |
          set -euo pipefail
          test -z "${RENDER_API_KEY:-}"
          echo 'LOCAL-PROVENANCE-UNKNOWN. Comparison is a sample, NOT proof of 4K, identical pixels or deployment.'

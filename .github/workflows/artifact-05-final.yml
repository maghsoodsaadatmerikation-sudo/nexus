name: NEXUS Artifact 05 Final

on:
  workflow_call:
    inputs:
      verified_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Commit SHA to verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  verify:
    name: Artifact 05 Contract Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve verification target
        id: target
        shell: bash
        env:
          CALLER_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="$CALLER_SHA"
          test -n "$TARGET_SHA"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Verification target: $TARGET_SHA"
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.target.outputs.sha }}
      - name: GATE 0 — pinned environment and manifest inputs
        run: |
          set -euo pipefail
          case "$RUST_IMAGE" in rust@sha256:*) ;; *) echo 'GATE 0 FAIL: RUST_IMAGE is not digest pinned'; exit 1 ;; esac
          docker pull "$RUST_IMAGE"
          test -f artifact-05/Cargo.toml
          test -f artifact-05/Cargo.lock
          echo 'GATE 0 PASS'
      - name: GATE 1 — build
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo fmt -- --check; cargo build --locked'
          echo 'GATE 1 PASS'
      - name: GATE 2 — tests
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo test --locked; cargo test --doc --locked'
          echo 'GATE 2 PASS'
      - name: GATE 3 — evidence integrity and lock invariant
        env:
          VERIFIED_COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          LOCK_HASH_BEFORE="$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')"
          printf '%s\n' "[VERIFY] NEXUS Artifact 05 Contract" "Verified Commit: $VERIFIED_COMMIT" "Run ID: $GITHUB_RUN_ID" "Docker Reference: $RUST_IMAGE" "Cargo.lock SHA-256 before: $LOCK_HASH_BEFORE" 'GATE 0 PASS' 'GATE 1 PASS' 'GATE 2 PASS' 'GATE 3 — evidence integrity' > artifact-05-verification.log
          LOCK_HASH_AFTER="$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')"
          echo "Cargo.lock SHA-256 after: $LOCK_HASH_AFTER" >> artifact-05-verification.log
          test "$LOCK_HASH_BEFORE" = "$LOCK_HASH_AFTER"
          echo 'Cargo.lock invariant: MATCH' >> artifact-05-verification.log
          echo 'GATE 3 PASS' >> artifact-05-verification.log
          echo 'Status: PASS' >> artifact-05-verification.log
      - name: Generate manifest
        env:
          VERIFIED_COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          LOCK_HASH="$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')"
          LOG_HASH="$(sha256sum artifact-05-verification.log | awk '{print $1}')"
          cat > artifact-05-verification-manifest.txt <<EOF
NEXUS Artifact 05 Verification Manifest
========================================
Protocol: NEXUS-Artifact-05-0.1
Status: PASS
Verified Commit: $VERIFIED_COMMIT
Run ID: $GITHUB_RUN_ID
Docker Reference: $RUST_IMAGE
Cargo.lock SHA-256: $LOCK_HASH
Verification Log SHA-256: $LOG_HASH
Verification Mode: locked
Invariant: Artifact 05 contract gates passed
EOF
      - name: Self-audit evidence
        env:
          VERIFIED_COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          grep -q '^Status: PASS$' artifact-05-verification-manifest.txt
          grep -q "^Verified Commit: $VERIFIED_COMMIT$" artifact-05-verification-manifest.txt
          grep -q '^Docker Reference: rust@sha256:' artifact-05-verification-manifest.txt
          test "$(grep '^Cargo.lock SHA-256:' artifact-05-verification-manifest.txt | cut -d' ' -f3)" = "$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')"
          test "$(grep '^Verification Log SHA-256:' artifact-05-verification-manifest.txt | cut -d' ' -f4)" = "$(sha256sum artifact-05-verification.log | awk '{print $1}')"
          grep -q '^Cargo.lock invariant: MATCH$' artifact-05-verification.log
          grep -q '^Status: PASS$' artifact-05-verification.log
          grep -q '^GATE 3 PASS$' artifact-05-verification.log
          echo '[SELF-AUDIT] PASS'
      - name: Bundle evidence
        run: |
          set -euo pipefail
          tar -czf verification-bundle-artifact-05.tar.gz artifact-05-verification-manifest.txt artifact-05-verification.log artifact-05/Cargo.lock
          test -s verification-bundle-artifact-05.tar.gz
      - name: Attest evidence bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: verification-bundle-artifact-05.tar.gz
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-05-final-evidence
          path: |
            artifact-05-verification.log
            artifact-05-verification-manifest.txt
            verification-bundle-artifact-05.tar.gz
          if-no-files-found: error

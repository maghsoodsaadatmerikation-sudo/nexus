name: NEXUS v1.9 Runtime Drift Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1.9-runtime-drift.yml'
      - 'scripts/observe-runtime-drift.sh'
      - 'scripts/test-runtime-drift.py'
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 9 * * *'
    - cron: '17 17 * * *'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  observe-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact observer commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test fail-closed observation diagnostics
        run: python3 scripts/test-runtime-drift.py

      - name: Observe public runtime identity fail-closed
        env:
          URL: https://nexus-stage-d-production.up.railway.app/v1/runtime-identity
          EXPECTED_DIGEST: d66021fc1e8c276df2c673d26b05f2de58ef4c81589261cb41aefa1ad047f1c7
        run: bash scripts/observe-runtime-drift.sh

      - name: Attest drift evidence
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: v1.9-runtime-drift-evidence.json

      - name: Upload drift evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: v1.9-runtime-drift-evidence
          path: |
            v1.9-runtime-drift-evidence.json
            v1.9-runtime-drift-evidence.sha256
          if-no-files-found: error

name: NEXUS PR Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  readonly-verification:
    name: readonly-verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # This candidate composes several previously verified PRs. Require the
      # unchanged upstream sources to retain their pinned Git blob identity;
      # Rust source conflicts are separately exercised by Cargo/HTTP tests.
      - name: Enforce composed candidate source identity
        run: python3 scripts/verify-composed-security-source.py

      # This job is the only required branch-ruleset status check. Cloud
      # transport tests must be part of this same job, not only an optional
      # path-filtered workflow whose failure could be ignored at merge.
      - name: Install pinned uv for mandatory cloud contract
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.4"
          enable-cache: "false"
          working-directory: nexus-cloud

      - name: Install pinned Python for mandatory cloud contract
        run: uv python install 3.13

      - name: Enforce cloud transport and Studio model tests in required PR status
        working-directory: nexus-cloud
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen python -m compileall -q main.py studio_model.py tests
          uv run --frozen pytest -q

      - name: Test fail-closed runtime diagnostics
        run: |
          bash -n scripts/observe-runtime-drift.sh
          python3 scripts/test-runtime-drift.py

      - name: Test fail-closed public Stage D authentication diagnostics
        run: |
          bash -n scripts/observe-stage-d-auth.sh
          python3 scripts/test-stage-d-auth.py

      - name: Verify without publication or attestation authority
        env:
          RUST_IMAGE: ${{ env.RUST_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/readonly-verification.sh

      - name: Verify durable-state resilience contract
        run: |
          bash -n scripts/v1.2-durable-state-resilience.sh
          bash scripts/v1.2-durable-state-resilience.sh
          python3 scripts/test-durable-state-contract.py

      - name: Verify transport authentication behavior
        run: bash scripts/v2.5-transport-authentication-verification.sh

      # Mandatory PR gate: test the operator freeze decision without provider
      # credentials or pretending that synthetic evidence grants release authority.
      - name: Test fail-closed Render and GitHub freeze preflight
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/production-freeze-preflight.py scripts/test-production-freeze-preflight.py
          python3 scripts/test-production-freeze-preflight.py

      # The full two-runner drill is exercised in its separate isolated
      # workflow. Require its reject-invalid-input self-test here as well.
      - name: Test isolated cross-runner recovery evidence contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pilot-cross-runner-recovery.py
          python3 scripts/pilot-cross-runner-recovery.py self-test

      - name: Verify workflow authority boundary
        run: python3 scripts/verify-workflow-authority.py

      - name: Test lifecycle-bound Stage D release gates
        run: |
          set -euo pipefail
          bash -n scripts/test-stage-d-readiness.sh
          bash scripts/test-stage-d-readiness.sh

      - name: Verify committed Railway Stage D evidence
        run: python3 scripts/verify-stage-d-railway-evidence.py

      - name: Verify current Seal documented truth
        run: python3 scripts/verify-current-seal-docs.py

      - name: Run Artifact 06 Synthetic Reality Lab
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash scripts/artifact-06-bootstrap.sh "${RUNNER_TEMP}/artifact-06-output"

      - name: Run Artifact 07 Public Exposure Safety
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash scripts/artifact-07-bootstrap.sh "${RUNNER_TEMP}/artifact-07-output"

      - name: Verify durable-host Blueprint without provider authority
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/verify-render-blueprint.sh

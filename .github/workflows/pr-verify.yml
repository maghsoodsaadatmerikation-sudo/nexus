name: NEXUS PR Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  readonly-verification:
    name: readonly-verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify without publication or attestation authority
        env:
          RUST_IMAGE: ${{ env.RUST_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/readonly-verification.sh

      - name: Verify durable-host Blueprint without provider authority
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/verify-render-blueprint.sh

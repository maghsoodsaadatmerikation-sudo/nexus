name: NEXUS Production Freeze Preflight Contract

on:
  pull_request:
    paths:
      - 'scripts/production-freeze-preflight.py'
      - 'scripts/test-production-freeze-preflight.py'
      - '.github/workflows/production-freeze-preflight.yml'
      - '.github/workflows/pr-verify.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/production-freeze-preflight.py'
      - 'scripts/test-production-freeze-preflight.py'
      - '.github/workflows/production-freeze-preflight.yml'

permissions:
  contents: read

jobs:
  freeze-metadata-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate offline observer with synthetic metadata only
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/production-freeze-preflight.py scripts/test-production-freeze-preflight.py
          python3 scripts/test-production-freeze-preflight.py

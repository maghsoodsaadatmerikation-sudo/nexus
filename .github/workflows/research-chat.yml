name: NEXUS Source-Grounded Conversation
on:
  pull_request:
    paths:
      - '.github/workflows/research-chat.yml'
      - 'artifact-05/**'
      - 'web/research-chat.html'
      - 'web/index.html'
      - 'scripts/test-research-chat-browser.py'
      - 'scripts/workspace-browser-runner.mjs'
      - 'docs/SOURCE-GROUNDED-CONVERSATION.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-chat.yml'
      - 'artifact-05/**'
      - 'web/research-chat.html'
      - 'web/index.html'
      - 'scripts/test-research-chat-browser.py'
      - 'scripts/workspace-browser-runner.mjs'
      - 'docs/SOURCE-GROUNDED-CONVERSATION.md'
permissions:
  contents: read
jobs:
  research-chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove no production credentials are available
        run: |
          test -z "${NEXUS_API_TOKEN:-}"
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
      - name: Test search consent, citation grounding and HTTP boundaries
        run: cargo test --locked --manifest-path artifact-05/Cargo.toml
      - name: Exercise real Chromium on narrow and wide layouts with synthetic retrieval only
        run: python3 scripts/test-research-chat-browser.py

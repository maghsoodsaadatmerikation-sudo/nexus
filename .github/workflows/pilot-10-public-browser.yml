name: NEXUS Pilot 10 — Real Public Browser Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/pilot-10-public-browser.yml'
      - 'scripts/observe-public-offline-browser.mjs'
      - 'scripts/prepare-public-pilot-witness.sh'
      - 'scripts/test-offline-pilot-browser.py'
      - 'scripts/test-decision-report-browser.py'
      - 'scripts/test-draft-guard-browser.py'
      - 'scripts/test-ui-languages-browser.py'
      - 'scripts/test-voice-browser.py'
      - 'scripts/test-file-desk-browser.py'
      - 'scripts/test-local-data-analysis-browser.py'
      - 'scripts/test-web-research-browser.py'
      - 'scripts/test-guided-chat-browser.py'
      - 'docs/PILOT-10-PUBLIC-BROWSER-ACCEPTANCE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-10-public-browser.yml'
      - 'scripts/observe-public-offline-browser.mjs'
      - 'scripts/prepare-public-pilot-witness.sh'
      - 'scripts/test-offline-pilot-browser.py'
      - 'scripts/test-decision-report-browser.py'
      - 'scripts/test-draft-guard-browser.py'
      - 'scripts/test-ui-languages-browser.py'
      - 'scripts/test-voice-browser.py'
      - 'scripts/test-file-desk-browser.py'
      - 'scripts/test-local-data-analysis-browser.py'
      - 'scripts/test-web-research-browser.py'
      - 'scripts/test-guided-chat-browser.py'
      - 'docs/PILOT-10-PUBLIC-BROWSER-ACCEPTANCE.md'
  workflow_dispatch:
  schedule:
    # Weekly read-only public check; avoid minute-zero global cron spikes.
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: nexus-public-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-public-acceptance:
    name: independently-test-real-https-on-mobile-and-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact CI candidate without write credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently observe pinned published source; candidate is tested separately
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-public-pilot-witness.sh
          cd "$RUNNER_TEMP/nexus-live-pilot"
          cp web/offline-pilot.html "$RUNNER_TEMP/deployed-source.html"
          python3 scripts/verify-public-static-pilot.py --expected "$RUNNER_TEMP/deployed-source.html" > public-static-identity.json
          python3 - <<'PY'
          import json
          d=json.load(open('public-static-identity.json'))
          assert d['status']=='PASS_STATIC_HTTPS_IDENTITY'
          assert d['matched_exact_html'] and d['http_status']==200
          assert d['authority']=='none' and d['production_mutation'] is False
          print('PASS: independent public HTTPS exact-byte identity')
          PY
      - name: Exercise the actual HTTPS site in real Chromium on two viewport classes
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${NEXUS_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          node --version
          test "$(node -p 'Number(process.versions.node.split(".")[0]) >= 22')" = "true"
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$NEXUS_PUBLIC_CHROME"
          node --check scripts/observe-public-offline-browser.mjs
          node scripts/observe-public-offline-browser.mjs > pilot-10-public-browser.json
          python3 - <<'PY'
          import json
          r=json.load(open('pilot-10-public-browser.json'))
          assert r['status']=='PASS'
          assert r['schema']=='nexus.public-pilot.browser-acceptance.v1'
          assert r['checks_per_layout']==46 and r['negative_local_fixtures']==6
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==46 and
                     x['real_reload_verified'] and x['test_fixture_only'] and
                     x['document_responses']>=2 and
                     x['browser_document_sha256']==r['source_sha256'] and
                     x['network_attempts_by_app']==0 for x in r['report'])
          assert r['synthetic_only'] and r['real_human_tested'] is False
          assert r['authenticated_rust_tested'] is False
          assert r['production_restore_tested'] is False
          assert r['authority']=='none' and r['production_mutation'] is False
          print('PASS: real public HTTPS synthetic mobile and desktop acceptance')
          PY
      - name: Exercise readable report on actual public HTTPS source
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_REPORT=true node scripts/observe-public-offline-browser.mjs > pilot-13-public-report.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-13-public-report.json'))
          assert r['schema']=='nexus.public-pilot.decision-report-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']==17
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==17 and x['document_responses']>=1
                     and x['network_attempts_by_app']==0 for x in r['report'])
          assert r['synthetic_only'] and not r['real_human_tested']
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: actual public HTTPS readable report; 17 checks per viewport')
          PYTEST
      - name: Exercise draft protection and local restore race on actual public HTTPS
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_DRAFT=true node scripts/observe-public-offline-browser.mjs > pilot-14-public-drafts.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-14-public-drafts.json'))
          assert r['schema']=='nexus.public-pilot.draft-guard-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']==21
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==21 and x['document_responses']>=1
                     and x['network_attempts_by_app']==0 for x in r['report'])
          assert r['synthetic_only'] and not r['real_human_tested']
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: actual public HTTPS draft guard; 21 checks per viewport')
          PYTEST
      - name: Exercise English default and private language switching on actual public HTTPS
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_LANGUAGE=true node scripts/observe-public-offline-browser.mjs > pilot-15-public-languages.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-15-public-languages.json'))
          assert r['schema']=='nexus.public-pilot.ui-language-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']==23
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==23 and x['document_responses']>=1
                     and x['network_attempts_by_app']==0 for x in r['report'])
          assert r['synthetic_only'] and not r['real_human_tested']
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: public English default and local language packs; 23 checks per viewport')
          PYTEST
      - name: Exercise public voice controls with controlled native adapters (not hardware audio)
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_VOICE=true node scripts/observe-public-offline-browser.mjs > pilot-16-public-voice.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-16-public-voice.json'))
          assert r['schema']=='nexus.public-pilot.voice-adapter-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']==35
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==35 and x['document_responses']>=1
                     and x['network_attempts_by_app']==0 for x in r['report'])
          assert r['native_audio_tested'] is False and r['voice_engines']=='controlled-test-adapters'
          assert r['synthetic_only'] and not r['real_human_tested']
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: public opt-in voice adapter behavior; physical audio NOT tested')
          PYTEST
      - name: Exercise published file desk with synthetic files and real download payloads
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_FILES=true node scripts/observe-public-offline-browser.mjs > pilot-17-public-files.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-17-public-files.json'))
          assert r['schema']=='nexus.public-pilot.file-desk-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']==33
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==33
                     and x['generated_formats_checked']==8
                     and x['document_responses']>=1
                     and x['network_attempts_by_app']==0 for x in r['report'])
          assert r['synthetic_only'] and not r['real_human_tested']
          assert r['authority']=='none' and not r['production_mutation']
          assert 'artifacts' not in str(r)
          print('PASS: public local file desk; 33 real-browser checks per viewport')
          PYTEST
      - name: Exercise published analysis with synthetic CSV JSON XLSX and zero upload
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_ANALYSIS=true node scripts/observe-public-offline-browser.mjs > pilot-18-public-analysis.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-18-public-analysis.json'))
          assert r['schema']=='nexus.public-pilot.data-analysis-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']>=25
          assert r['source_sha256']==r['independent_get_sha256']
          assert {p['layout'] for p in r['report']}=={'narrow','wide'}
          assert all(p['status']=='PASS' and p['checks']==r['checks_per_layout']
                     and p['local_analysis_checked'] and p['document_responses']>=1
                     and p['network_attempts_by_app']==0
                     and p['browser_document_sha256']==r['source_sha256']
                     for p in r['report'])
          assert r['synthetic_only'] and r['real_human_tested'] is False
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: public offline analysis with controlled synthetic files, no server data')
          PYTEST
      - name: Independently exercise public HTTPS external search consent and URL safety
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_WEB_RESEARCH=true node scripts/observe-public-offline-browser.mjs > pilot-19-public-web.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-19-public-web.json'))
          assert r['schema']=='nexus.public-pilot.web-research-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']>=25
          assert r['source_sha256']==r['independent_get_sha256']
          assert {p['layout'] for p in r['report']}=={'narrow','wide'}
          assert all(p['status']=='PASS' and p['checks']==r['checks_per_layout']
                     and p['web_research_checked'] and p['document_responses']>=1
                     and p['network_attempts_by_app']==0
                     and p['browser_document_sha256']==r['source_sha256']
                     for p in r['report'])
          assert r['synthetic_only'] and r['real_human_tested'] is False
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: real public HTTPS web research handoff, explicit consent, zero app fetch')
          PYTEST
      - name: Independently exercise published guided conversation and user-controlled microphone drafts
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_GUIDED_CHAT=true node scripts/observe-public-offline-browser.mjs > pilot-20-public-guided-chat.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-20-public-guided-chat.json'))
          assert r['schema']=='nexus.public-pilot.guided-chat-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']>=36
          assert r['source_sha256']==r['independent_get_sha256']
          assert {p['layout'] for p in r['report']}=={'narrow','wide'}
          assert all(p['status']=='PASS' and p['checks']==r['checks_per_layout']
                     and p['guided_chat_checked'] and p['document_responses']>=1
                     and p['network_attempts_by_app']==0
                     and p['browser_document_sha256']==r['source_sha256']
                     for p in r['report'])
          assert r['synthetic_only'] and r['real_human_tested'] is False
          assert r['native_audio_tested'] is False
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: public guided chat, drafts, synthetic microphone adapters, no authority')
          PYTEST
      - name: Upload public-only sanitized evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-pilot-10-public-browser-acceptance
          path: |
            ${{ runner.temp }}/nexus-live-pilot/public-static-identity.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-10-public-browser.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-13-public-report.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-14-public-drafts.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-15-public-languages.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-16-public-voice.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-17-public-files.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-18-public-analysis.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-19-public-web.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-20-public-guided-chat.json
          if-no-files-found: ignore
          retention-days: 14

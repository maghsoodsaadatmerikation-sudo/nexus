name: NEXUS Pilot 10 — Real Public Browser Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/pilot-10-public-browser.yml'
      - 'scripts/observe-public-offline-browser.mjs'
      - 'scripts/prepare-public-pilot-witness.sh'
      - 'scripts/test-offline-pilot-browser.py'
      - 'scripts/test-decision-report-browser.py'
      - 'docs/PILOT-10-PUBLIC-BROWSER-ACCEPTANCE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-10-public-browser.yml'
      - 'scripts/observe-public-offline-browser.mjs'
      - 'scripts/prepare-public-pilot-witness.sh'
      - 'scripts/test-offline-pilot-browser.py'
      - 'scripts/test-decision-report-browser.py'
      - 'docs/PILOT-10-PUBLIC-BROWSER-ACCEPTANCE.md'
  workflow_dispatch:
  schedule:
    # Weekly read-only public check; avoid minute-zero global cron spikes.
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: nexus-public-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-public-acceptance:
    name: independently-test-real-https-on-mobile-and-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact CI candidate without write credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently observe pinned published source; candidate is tested separately
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-public-pilot-witness.sh
          cd "$RUNNER_TEMP/nexus-live-pilot"
          cp web/offline-pilot.html "$RUNNER_TEMP/deployed-source.html"
          python3 scripts/verify-public-static-pilot.py --expected "$RUNNER_TEMP/deployed-source.html" > public-static-identity.json
          python3 - <<'PY'
          import json
          d=json.load(open('public-static-identity.json'))
          assert d['status']=='PASS_STATIC_HTTPS_IDENTITY'
          assert d['matched_exact_html'] and d['http_status']==200
          assert d['authority']=='none' and d['production_mutation'] is False
          print('PASS: independent public HTTPS exact-byte identity')
          PY
      - name: Exercise the actual HTTPS site in real Chromium on two viewport classes
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${NEXUS_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          node --version
          test "$(node -p 'Number(process.versions.node.split(".")[0]) >= 22')" = "true"
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$NEXUS_PUBLIC_CHROME"
          node --check scripts/observe-public-offline-browser.mjs
          node scripts/observe-public-offline-browser.mjs > pilot-10-public-browser.json
          python3 - <<'PY'
          import json
          r=json.load(open('pilot-10-public-browser.json'))
          assert r['status']=='PASS'
          assert r['schema']=='nexus.public-pilot.browser-acceptance.v1'
          assert r['checks_per_layout']==46 and r['negative_local_fixtures']==6
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==46 and
                     x['real_reload_verified'] and x['test_fixture_only'] and
                     x['document_responses']>=2 and
                     x['browser_document_sha256']==r['source_sha256'] and
                     x['network_attempts_by_app']==0 for x in r['report'])
          assert r['synthetic_only'] and r['real_human_tested'] is False
          assert r['authenticated_rust_tested'] is False
          assert r['production_restore_tested'] is False
          assert r['authority']=='none' and r['production_mutation'] is False
          print('PASS: real public HTTPS synthetic mobile and desktop acceptance')
          PY
      - name: Exercise readable report on actual public HTTPS source
        working-directory: ${{ runner.temp }}/nexus-live-pilot
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PUBLIC_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          NEXUS_PUBLIC_REPORT=true node scripts/observe-public-offline-browser.mjs > pilot-13-public-report.json
          python3 - <<'PYTEST'
          import json
          r=json.load(open('pilot-13-public-report.json'))
          assert r['schema']=='nexus.public-pilot.decision-report-acceptance.v1'
          assert r['status']=='PASS' and r['checks_per_layout']==17
          assert r['source_sha256']==r['independent_get_sha256']
          assert {x['layout'] for x in r['report']}=={'narrow','wide'}
          assert all(x['status']=='PASS' and x['checks']==17 and x['document_responses']>=1
                     and x['network_attempts_by_app']==0 for x in r['report'])
          assert r['synthetic_only'] and not r['real_human_tested']
          assert r['authority']=='none' and not r['production_mutation']
          print('PASS: actual public HTTPS readable report; 17 checks per viewport')
          PYTEST
      - name: Upload public-only sanitized evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-pilot-10-public-browser-acceptance
          path: |
            ${{ runner.temp }}/nexus-live-pilot/public-static-identity.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-10-public-browser.json
            ${{ runner.temp }}/nexus-live-pilot/pilot-13-public-report.json
          if-no-files-found: ignore
          retention-days: 14

name: NEXUS v1.8 Historical Signed Evidence Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/v18-historical-signed-evidence.yml'
      - 'scripts/release-v18-attestation-subject.py'
      - 'scripts/release-run-provenance.py'
      - 'scripts/fixtures/v1.8-rebuild-evidence-main-2026-11-18.json'
      - 'scripts/test-release-v18-attestation-subject.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  historical-v18-signed-evidence:
    name: Read-only real v1.8 attestation acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Checkout exact unprivileged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm no publication or provider authority
        run: |
          set -euo pipefail
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          test -z "${NEXUS_API_TOKEN:-}"
          python3 scripts/test-release-v18-attestation-subject.py

      - name: Download and verify historical real signed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = 'maghsoodsaadatmerikation-sudo/nexus'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/evidence"
          gh run download 44222980195 --repo "$REPO" \
            --name v1.8-independent-rebuild-evidence --dir "$tmp/evidence"
          evidence="$tmp/evidence/v1.8-reproducibility-evidence.json"
          test -f "$evidence"
          test ! -L "$evidence"
          test "$(wc -c < "$evidence")" -eq 933
          test "$(sha256sum "$evidence" | cut -d ' ' -f 1)" = \
            '220b08c8c41f875679cbb18044746dc00f7e3d16e8d5a411cd276a0fd02a4474'
          cmp "$evidence" scripts/fixtures/v1.8-rebuild-evidence-main-2026-11-18.json
          gh attestation verify "$evidence" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/v1.8-independent-rebuild.yml" \
            --source-ref refs/heads/main \
            --source-digest 1ee30f7784420f27bba5d5d5798d9cdf3b64c89f \
            --deny-self-hosted-runners --format json > "$tmp/verified.json"
          python3 scripts/release-v18-attestation-subject.py \
            --verified-json "$tmp/verified.json" \
            --artifact "$evidence" --repo-id 1330624116
          echo 'HISTORICAL SIGNED EVIDENCE: VERIFIED READ-ONLY'
          echo 'This check does NOT grant current release or production authority.'

name: NEXUS Cloud Boundary Source Integration

on:
  pull_request:
    paths:
      - 'integration/cloud-boundary-195-196-manifest.json'
      - 'scripts/verify-cloud-boundary-integration.py'
      - 'nexus-cloud/**'
      - '.github/workflows/pr-verify.yml'
      - '.github/workflows/cloud-boundary-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-boundary-source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject source drift, duplicated input records and false authority
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-cloud-boundary-integration.py
          python3 scripts/verify-cloud-boundary-integration.py --self-test

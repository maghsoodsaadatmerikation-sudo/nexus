name: NEXUS Stage D Private Export Intake Tests

on:
  pull_request:
    paths:
      - '.github/workflows/stage-d-private-volume-intake.yml'
      - 'scripts/verify-offhost-volume-export.py'
      - 'scripts/test-offhost-volume-export.py'
      - 'scripts/data-snapshot.py'
      - 'docs/STAGE-D-PRIVATE-EXPORT-INTAKE.md'

permissions:
  contents: read

jobs:
  private-offhost-intake-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate private volume export intake contract with synthetic data
        run: |
          python3 -m py_compile scripts/verify-offhost-volume-export.py scripts/test-offhost-volume-export.py
          python3 scripts/test-offhost-volume-export.py

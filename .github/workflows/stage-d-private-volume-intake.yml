name: NEXUS Stage D Private Export Intake Tests

on:
  pull_request:
    paths:
      - '.github/workflows/stage-d-private-volume-intake.yml'
      - 'scripts/verify-offhost-volume-export.py'
      - 'scripts/capture-railway-volume-readonly.py'
      - 'scripts/test-capture-railway-volume-readonly.py'
      - 'scripts/test-railway-cli-help.py'
      - 'docs/STAGE-D-READONLY-CLI-CAPTURE.md'
      - 'scripts/test-offhost-volume-export.py'
      - 'scripts/data-snapshot.py'
      - 'scripts/test-private-core-audit.py'
      - 'scripts/stage-d-core-parity.py'
      - 'scripts/test-stage-d-core-parity.py'
      - 'src/bin/nexus-private-core-audit.rs'
      - 'src/workspace_persistence.rs'
      - 'src/workspace.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/STAGE-D-PRIVATE-EXPORT-INTAKE.md'

permissions:
  contents: read

jobs:
  private-offhost-intake-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact test revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate private volume export intake contract with synthetic data
        run: |
          python3 -m py_compile scripts/verify-offhost-volume-export.py scripts/test-offhost-volume-export.py scripts/capture-railway-volume-readonly.py scripts/test-capture-railway-volume-readonly.py
          python3 scripts/test-offhost-volume-export.py
      - name: Verify private read-only CLI download with fake provider only
        run: |
          set -euo pipefail
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          python3 scripts/test-capture-railway-volume-readonly.py

  real-cli-parser-conformance:
    name: real-railway-cli-readonly-grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact tested code, without persistent Git credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert no production credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          test -z "${NEXUS_API_TOKEN:-}"
      - name: Download publicly released CLI v5.71.0 and verify immutable SHA-256
        shell: bash
        env:
          RAILWAY_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/railway-v5.71.0.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            "https://github.com/railwayapp/cli/releases/download/v5.71.0/railway-v5.71.0-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            '2e682fd2ddf8d6fdf9e46d9d99d99646ff0022a6abb0c2bca93011348a269fb9' \
            "$archive" | sha256sum --check --status
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          archive=Path(os.environ['RUNNER_TEMP'])/'railway-v5.71.0.tar.gz'
          binary=Path(os.environ['RUNNER_TEMP'])/'railway-v5.71.0'
          with tarfile.open(archive,'r:gz') as content:
              matches=[f for f in content.getmembers()
                       if f.name in ('railway','./railway') and f.isfile()]
              assert len(matches)==1, 'pinned CLI artifact does not include single railway executable'
              assert matches[0].size<40*1024*1024
              f=content.extractfile(matches[0])
              assert f is not None
              with binary.open('xb') as target:
                  while True:
                      chunk=f.read(65536)
                      if not chunk: break
                      target.write(chunk)
          binary.chmod(0o700)
          PY
      - name: Test actual provider CLI parser with help/version only
        shell: bash
        env:
          RAILWAY_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          python3 scripts/test-railway-cli-help.py \
            --railway-bin "$RUNNER_TEMP/railway-v5.71.0"
          echo 'No Railway network authentication, volume listing or download was attempted.'

  private-rust-core-audit:
    name: private-rust-semantic-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact revision with no persistent credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require zero production credentials and a pinned source toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          test -z "${NEXUS_API_TOKEN:-}"
          grep -Eq '^channel = "1.85.0"$' rust-toolchain.toml
      - name: Prove selected workspace sources equal observed pinned Railway revision
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/stage-d-core-parity.py scripts/test-stage-d-core-parity.py
          python3 scripts/test-stage-d-core-parity.py
          python3 scripts/stage-d-core-parity.py --runtime-commit 3c0977f4c7fc9fb5e9a78bdb1eeb581cb3cb4959
      - name: Compile current Rust durable workspace semantic validator
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin nexus-private-core-audit
          cargo test --locked --bin nexus-private-core-audit
      - name: Run real Rust semantic validation against synthetic copied data
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_PRIVATE_CORE_AUDIT_BIN="$PWD/target/debug/nexus-private-core-audit"
          python3 -m py_compile scripts/test-private-core-audit.py
          python3 scripts/test-private-core-audit.py
          echo 'No Railway access; no user data or recovery archive published.'

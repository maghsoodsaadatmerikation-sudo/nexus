name: NEXUS v2.4 Release Gate

on:
  workflow_run:
    workflows: ["NEXUS v2.4 Gateway Authority-Confusion Verification"]
    types: [completed]

permissions:
  contents: write
  actions: read
  attestations: read

jobs:
  seal-v2-4:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require explicit exact-candidate release intent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-intents/v2.4.0
          message="$(gh api "repos/${REPO}/commits/${SHA}" --jq '.commit.message')"
          test "$message" = 'release(v2.4): request gateway-authority-confusion seal'
          if git ls-remote --exit-code --tags origin refs/tags/v2.4.0 >/dev/null 2>&1; then
            echo 'v2.4.0 already exists; refusing duplicate seal'; exit 1
          fi

      - name: Require canonical exact-candidate verification
        id: canonical
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          V24_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPO}/actions/runs/${V24_RUN}" --jq '.head_sha')" = "$SHA"
          test "$(gh api "repos/${REPO}/actions/runs/${V24_RUN}" --jq '.conclusion')" = success
          verify_run=''; status=''; conclusion=''
          for attempt in $(seq 1 60); do
            verification="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&event=push&per_page=100" --jq '[.workflow_runs[] | select(.name == "NEXUS Verification")][0] // {}')"
            verify_run="$(jq -r '.id // empty' <<<"$verification")"
            status="$(jq -r '.status // empty' <<<"$verification")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$verification")"
            if [ "$status" = completed ]; then test "$conclusion" = success; break; fi
            echo "Waiting for canonical verification (attempt ${attempt}/60; status=${status:-not-found})"
            sleep 10
          done
          test -n "$verify_run"; test "$status" = completed; test "$conclusion" = success
          test "$(gh api "repos/${REPO}/actions/runs/${verify_run}" --jq '.head_sha')" = "$SHA"
          echo "verify_run=${verify_run}" >> "$GITHUB_OUTPUT"

      - name: Validate attestation and bind v2.4 evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          V24_RUN: ${{ github.event.workflow_run.id }}
          VERIFY_RUN: ${{ steps.canonical.outputs.verify_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          gh run download "$V24_RUN" --repo "$REPO" -n nexus-v2.4-gateway-authority-confusion-evidence -D release-evidence
          M='release-evidence/evidence-v2.4/manifest.txt'
          A='release-evidence/nexus-v2.4-gateway-authority-confusion-evidence.tar.gz'
          test -f "$M"; test -f "$A"
          gh attestation verify "$A" --repo "$REPO"
          grep -Fx 'schema=nexus.v2.4.gateway-authority-confusion.v1' "$M"
          grep -Fx 'status=PASS' "$M"
          grep -Fx "candidate_sha=${SHA}" "$M"
          grep -Fx "workflow_run_id=${V24_RUN}" "$M"
          grep -Fx 'authority_rule=A_out<=A_in' "$M"
          grep -Fx 'exact_request_schema=true' "$M"
          grep -Fx 'unknown_fields_rejected_before_delegate=true' "$M"
          grep -Fx 'authority_like_fields_rejected_before_delegate=true' "$M"
          grep -Fx 'authority_mutation_routes=false' "$M"
          grep -Fx 'async_202_contract_preserved=true' "$M"
          grep -Fx 'status_404_contract_preserved=true' "$M"
          grep -Fx 'cryptographic_authenticity_claim=false' "$M"
          grep -Fx 'production_mutation=false' "$M"
          grep -Fx 'authority_expansion=NONE' "$M"
          mkdir -p release-evidence/unpacked
          tar -xzf "$A" -C release-evidence/unpacked
          (cd release-evidence/unpacked/evidence-v2.4 && sha256sum -c SHA256SUMS)
          evidence_sha="$(sha256sum "$A" | awk '{print $1}')"
          printf '%s\n' 'schema=nexus.v2.4.release-evidence.v1' 'status=PASS' +            "candidate_sha=${SHA}" "v2.4_run_id=${V24_RUN}" "nexus_verification_run_id=${VERIFY_RUN}" +            "gateway_evidence_sha256=${evidence_sha}" 'authority_rule=A_out<=A_in' +            'attestation_verified=true' 'unknown_fields_rejected_before_delegate=true' +            'production_mutation=false' 'paid_upgrade_required=false' 'authority_expansion=NONE' > v2.4-release-evidence.txt

      - name: Create v2.4 Gateway boundary seal
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          V24_RUN: ${{ github.event.workflow_run.id }}
          VERIFY_RUN: ${{ steps.canonical.outputs.verify_run }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_sha="$(sha256sum v2.4-release-evidence.txt | awk '{print $1}')"
          cat > /tmp/notes.md <<EOF
          # NEXUS v2.4.0 — Gateway Authority-Confusion Defense Sealed

          **STATUS: SEALED / VERIFIED AT THE STATED GATEWAY BOUNDARY**

          `A_out <= A_in`

          - Exact release candidate: `${SHA}`
          - NEXUS v2.4 Gateway Verification run: `${V24_RUN}` — SUCCESS
          - Canonical NEXUS Verification run: `${VERIFY_RUN}` — SUCCESS
          - Exact-candidate evidence attestation: VERIFIED
          - Unknown and authority-like fields: REJECTED BEFORE DELEGATION
          - Authority-mutation routes: ABSENT
          - Existing asynchronous 202 and status/404 contract: PRESERVED
          - Production mutation: NO
          - Authority expansion: NONE
          - Release evidence SHA-256: `${evidence_sha}`

          This seal is deliberately narrow. It does not claim that HTTP authenticates authority, that clients are trustworthy, cryptographic transport authenticity, durable or distributed persistence, consensus, federation, provider correctness, universal security, or external-system linearizability.
          EOF
          gh release create v2.4.0 --target "$SHA" --title 'NEXUS v2.4.0 — Gateway Authority-Confusion Defense Sealed' --notes-file /tmp/notes.md

      - name: Assert seal exists on exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPO}/releases/tags/v2.4.0" --jq '.draft')" = false
          test "$(gh api "repos/${REPO}/releases/tags/v2.4.0" --jq '.prerelease')" = false
          test "$(gh api "repos/${REPO}/releases/tags/v2.4.0" --jq '.target_commitish')" = "$SHA"

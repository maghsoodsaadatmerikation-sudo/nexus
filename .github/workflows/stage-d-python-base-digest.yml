name: NEXUS Stage D Python Base Digest Probe
on:
  pull_request:
    paths:
      - '.github/workflows/stage-d-python-base-digest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve-python-oci-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve immutable upstream Docker base manifest for review
        run: |
          set -euo pipefail
          docker buildx imagetools inspect docker.io/library/python:3.12.12-slim-bookworm
          echo 'Resolve only: no image publish or provider deployment'

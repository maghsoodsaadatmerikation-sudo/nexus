name: NEXUS v2.1 Release Gate

on:
  workflow_run:
    workflows: ["NEXUS v2.1 Enforcement Verification"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  seal-v2-1:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require explicit exact-candidate release intent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-intents/v2.1.0
          message="$(gh api "repos/${REPO}/commits/${SHA}" --jq '.commit.message')"
          test "$message" = 'release(v2.1): request capability-enforcement seal'
          if git ls-remote --exit-code --tags origin refs/tags/v2.1.0 >/dev/null 2>&1; then
            echo 'v2.1.0 already exists; refusing duplicate seal'; exit 1
          fi

      - name: Require canonical exact-candidate verification
        id: canonical
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          V21_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPO}/actions/runs/${V21_RUN}" --jq '.head_sha')" = "$SHA"
          test "$(gh api "repos/${REPO}/actions/runs/${V21_RUN}" --jq '.conclusion')" = success
          verify_run="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&event=push&per_page=100" --jq '[.workflow_runs[] | select(.name == "NEXUS Verification" and .status == "completed" and .conclusion == "success")][0].id // empty')"
          test -n "$verify_run"
          test "$(gh api "repos/${REPO}/actions/runs/${verify_run}" --jq '.head_sha')" = "$SHA"
          echo "verify_run=${verify_run}" >> "$GITHUB_OUTPUT"

      - name: Validate and bind v2.1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          V21_RUN: ${{ github.event.workflow_run.id }}
          VERIFY_RUN: ${{ steps.canonical.outputs.verify_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          gh run download "$V21_RUN" --repo "$REPO" -n nexus-v2.1-enforcement-evidence -D release-evidence
          M='release-evidence/evidence-v2.1/manifest.txt'
          A='release-evidence/nexus-v2.1-enforcement-evidence.tar.gz'
          test -f "$M"; test -f "$A"
          grep -Fx 'schema=nexus.v2.1.enforcement-verification.v1' "$M"
          grep -Fx 'status=PASS' "$M"
          grep -Fx "candidate_sha=${SHA}" "$M"
          grep -Fx "workflow_run_id=${V21_RUN}" "$M"
          grep -Fx 'authority_rule=A_child<=A_parent<=A_in' "$M"
          grep -Fx 'authorized_request_boundary=true' "$M"
          grep -Fx 'validity_window_fail_closed=true' "$M"
          grep -Fx 'audit_authority=non_authoritative' "$M"
          grep -Fx 'production_mutation=false' "$M"
          grep -Fx 'authority_expansion=NONE' "$M"
          evidence_sha="$(sha256sum "$A" | awk '{print $1}')"
          printf '%s\n' \
            'schema=nexus.v2.1.release-evidence.v1' 'status=PASS' \
            "candidate_sha=${SHA}" "v2.1_run_id=${V21_RUN}" "nexus_verification_run_id=${VERIFY_RUN}" \
            "enforcement_evidence_sha256=${evidence_sha}" 'authority_rule=A_child<=A_parent<=A_in' \
            'production_mutation=false' 'paid_upgrade_required=false' 'authority_expansion=NONE' > v2.1-release-evidence.txt
          sha256sum v2.1-release-evidence.txt > v2.1-release-evidence.sha256

      - name: Create v2.1 enforcement seal
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          V21_RUN: ${{ github.event.workflow_run.id }}
          VERIFY_RUN: ${{ steps.canonical.outputs.verify_run }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_sha="$(sha256sum v2.1-release-evidence.txt | awk '{print $1}')"
          cat > /tmp/notes.md <<EOF
          # NEXUS v2.1.0 — Capability Enforcement Boundary Sealed

          **STATUS: SEALED / VERIFIED AT THE STATED ENFORCEMENT BOUNDARY**

          \`A_child <= A_parent <= A_in\`

          - Exact release candidate: \`${SHA}\`
          - NEXUS v2.1 Enforcement Verification run: \`${V21_RUN}\` — SUCCESS
          - Canonical NEXUS Verification run: \`${VERIFY_RUN}\` — SUCCESS
          - Capability validation before AuthorizedRequest construction: VERIFIED
          - Invalid validity windows fail closed: VERIFIED
          - Capability audit observations: append-only through the public API and NON-AUTHORITATIVE
          - Production mutation: NO
          - Paid upgrade required: NO
          - Authority expansion: NONE
          - Release evidence SHA-256: \`${evidence_sha}\`

          This seal is deliberately narrow. It does not claim cryptographic grant authenticity, durable/distributed revocation persistence, external identity federation, universal security, provider correctness, or authority beyond the parent/input boundary.
          EOF
          gh release create v2.1.0 --target "$SHA" --title 'NEXUS v2.1.0 — Capability Enforcement Boundary Sealed' --notes-file /tmp/notes.md

      - name: Assert seal exists on exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPO}/releases/tags/v2.1.0" --jq '.draft')" = false
          test "$(gh api "repos/${REPO}/releases/tags/v2.1.0" --jq '.prerelease')" = false
          test "$(gh api "repos/${REPO}/releases/tags/v2.1.0" --jq '.target_commitish')" = "$SHA"

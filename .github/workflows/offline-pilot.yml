name: NEXUS No-Cost Offline Pilot

on:
  pull_request:
    paths:
      - '.github/workflows/offline-pilot.yml'
      - 'web/offline-pilot.html'
      - 'scripts/test-offline-pilot-browser.py'
      - 'scripts/test-decision-report-browser.py'
      - 'scripts/test-draft-guard-browser.py'
      - 'scripts/test-ui-languages-browser.py'
      - 'scripts/test-voice-browser.py'
      - 'scripts/test-file-desk-browser.py'
      - 'scripts/test-local-data-analysis-browser.py'
      - 'scripts/test-web-research-browser.py'
      - 'web/web-research-core.js'
      - 'web/data-analysis-core.js'
      - 'scripts/build-ui-languages.py'
      - 'web/locales/**'
      - 'scripts/test-offline-to-rust-http.py'
      - 'docs/PILOT-06-OFFLINE-RUST-BRIDGE.md'
      - 'scripts/workspace-browser-runner.mjs'
      - 'docs/OFFLINE-PILOT.md'
      - 'Dockerfile'
      - 'artifact-05/**'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-pilot.yml'
      - 'web/offline-pilot.html'
      - 'scripts/test-offline-pilot-browser.py'
      - 'scripts/test-decision-report-browser.py'
      - 'scripts/test-draft-guard-browser.py'
      - 'scripts/test-ui-languages-browser.py'
      - 'scripts/test-voice-browser.py'
      - 'scripts/test-file-desk-browser.py'
      - 'scripts/test-local-data-analysis-browser.py'
      - 'scripts/test-web-research-browser.py'
      - 'web/web-research-core.js'
      - 'web/data-analysis-core.js'
      - 'scripts/build-ui-languages.py'
      - 'web/locales/**'
      - 'scripts/test-offline-to-rust-http.py'
      - 'docs/PILOT-06-OFFLINE-RUST-BRIDGE.md'
      - 'scripts/workspace-browser-runner.mjs'
      - 'docs/OFFLINE-PILOT.md'
      - 'Dockerfile'
      - 'artifact-05/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pilot-browser:
    name: offline-pilot-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision without persistent credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify offline Persian mobile and desktop pilot in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_BRIDGE_SYNTHETIC_OUTPUT="$RUNNER_TEMP/nexus-p06-synthetic-browser.json"
          # Only on a real GitHub-hosted Chromium job, allow bounded 30s
          # cold start; negative fake-browser tests keep strict 10s default.
          export NEXUS_CHROME_STARTUP_GRACE_MS=30000
          python3 scripts/test-offline-pilot-browser.py > offline-pilot-ci-report.json
          python3 - <<'PY'
          import json
          report=json.load(open('offline-pilot-ci-report.json'))
          assert report['status']=='PASS'
          assert report['authority']=='none'
          assert report['production_verified'] is False
          assert len(report['reports'])==2
          assert all(x['status']=='PASS' and x['network_requests']==0 and
                     len(x['checks'])==46 for x in report['reports'])
          print('NEXUS PILOT 11: SELECTED ENCRYPTED BACKUP RECOVERY + PILOT 09 + RUST BRIDGE PASS')
          PY
      - name: Verify readable decision report without workspace mutation
        run: python3 scripts/test-decision-report-browser.py > decision-report-browser.json
      - name: Verify uncommitted input guard and encrypted restore race
        run: python3 scripts/test-draft-guard-browser.py > draft-guard-browser.json
      - name: Verify complete embedded catalogs and English-first private language switching
        run: |
          python3 scripts/build-ui-languages.py --check
          python3 scripts/test-ui-languages-browser.py > ui-languages-browser.json
      - name: Verify opt-in voice lifecycle with controlled native adapters
        run: python3 scripts/test-voice-browser.py > voice-browser.json
      - name: Verify file admission, bounded previews and independently parsed output packages
        run: python3 scripts/test-file-desk-browser.py > file-desk-browser.json
      - name: Verify bounded local data analysis and no new decision authority
        shell: bash
        run: |
          set -euo pipefail
          node --check web/data-analysis-core.js
          python3 scripts/test-local-data-analysis-browser.py > data-analysis-browser.json
          python3 - <<'PY'
          import json
          r=json.load(open('data-analysis-browser.json'))
          assert r['schema']=='nexus.pilot-18.local-analysis-witness.v1'
          assert r['status']=='PASS' and len(r['reports'])==2
          assert all(len(p['checks'])>=25 and p['network_requests']==0
                     and p['authority']=='none' and not p['production_mutation']
                     for p in r['reports'])
          assert {p['layout'] for p in r['reports']}=={'narrow','wide'}
          print('PASS: bounded local analytics, no network or authority')
          PY
      - name: Verify explicit web research consent and no workspace exfiltration
        shell: bash
        run: |
          set -euo pipefail
          node --check web/web-research-core.js
          python3 scripts/test-web-research-browser.py > web-research-browser.json
          python3 - <<'PY'
          import json
          data=json.load(open('web-research-browser.json'))
          assert data['schema']=='nexus.pilot-19.web-research-witness.v1'
          assert data['status']=='PASS' and len(data['reports'])==2
          assert {p['layout'] for p in data['reports']}=={'narrow','wide'}
          assert all(len(p['checks'])>=25 and p['network_requests']==0
                     and p['authority']=='none' and not p['production_mutation']
                     and p['real_web_results_tested'] is False
                     for p in data['reports'])
          print('PASS: consent-gated external engine handoff without app network requests')
          PY
      - name: Verify exported synthetic bridge against live disposable Rust API
        shell: bash
        env:
          NEXUS_BRIDGE_DISPOSABLE: 'true'
        run: |
          set -euo pipefail
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          test -z "${NEXUS_API_TOKEN:-}"
          export NEXUS_BRIDGE_SYNTHETIC_OUTPUT="$RUNNER_TEMP/nexus-p06-synthetic-browser.json"
          docker build --pull=false -t nexus-pilot-06:ci .
          python3 scripts/test-offline-to-rust-http.py
          python3 - <<'PY'
          import json
          with open('pilot-06-rust-bridge-report.json', encoding='utf8') as f:
              report=json.load(f)
          assert report['status']=='PASS_REAL_RUST_IMPORT_OF_BROWSER_RECONSTRUCTION'
          assert report['browser_generated_schema_accepted']
          assert report['import_creates_new_workspace']
          assert report['missing_and_wrong_bearer_denied']
          assert report['duplicate_conflict']
          assert report['audit_tampering_rejected']
          assert report['survived_disposable_restart']
          assert report['provenance_explicitly_unattested']
          assert report['production_gateway_contacted'] is False
          assert report['production_backup_proven'] is False
          assert report['authority']=='none'
          print('NEXUS PILOT 06: AUTHENTICATED RUST IMPORT REPLAY PASS')
          PY
      - name: Upload sanitized Rust compatibility witness
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-pilot-06-rust-bridge-witness
          path: pilot-06-rust-bridge-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish standalone HTML artifact for direct offline use
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-offline-pilot-standalone-html
          path: web/offline-pilot.html
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized offline-browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-offline-pilot-synthetic-witness
          path: |
            offline-pilot-ci-report.json
            decision-report-browser.json
            draft-guard-browser.json
            ui-languages-browser.json
            voice-browser.json
            file-desk-browser.json
            data-analysis-browser.json
            web-research-browser.json
          if-no-files-found: ignore
          retention-days: 30

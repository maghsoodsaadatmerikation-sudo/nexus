name: NEXUS Historical Rust Workspace Reader Compatibility
on:
  pull_request:
    paths:
      - 'scripts/nexus-historical-rust-reader-shim.rs'
      - 'scripts/generate-workspace-cross-version-fixtures.py'
      - 'scripts/workspace-stage-d-data-rollback-screen.py'
      - 'docs/STAGE-D-DATA-ROLLBACK-COMPAT.md'
      - '.github/workflows/stage-d-historical-rust-reader.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/nexus-historical-rust-reader-shim.rs'
      - 'scripts/generate-workspace-cross-version-fixtures.py'
      - '.github/workflows/stage-d-historical-rust-reader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historic-real-rust-core-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out exact PR commit with complete immutable history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build historical constitutional core readers in disposable worktrees
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          command -v cargo
          command -v rustup
          rustup toolchain install 1.85.0 --profile minimal
          tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/nexus-historical-reader-XXXXXXXX")"
          trap 'for role in recovery source target; do git worktree remove --force "$tmp/$role" 2>/dev/null || true; done; rm -rf "$tmp"' EXIT
          python3 -B scripts/generate-workspace-cross-version-fixtures.py "$tmp/fixtures"
          export CARGO_TARGET_DIR="$tmp/target"
          checks=0
          for role in recovery source target; do
            case "$role" in
              recovery) revision="588dc7672146031425b16b34956876d644244ace" ;;
              source) revision="9abbc067aad3ebbb0956432cf6682d2ea70e2824" ;;
              target) revision="f4d027bb5f7e715b298f7cf7184fa621a2fb071d" ;;
            esac
            git cat-file -e "${revision}^{commit}"
            git worktree add --detach "$tmp/$role" "$revision" >/dev/null
            test "$(git -C "$tmp/$role" rev-parse HEAD)" = "$revision"
            mkdir -p "$tmp/$role/src/bin"
            cp scripts/nexus-historical-rust-reader-shim.rs "$tmp/$role/src/bin/nexus-cross-version-reader.rs"
            RUSTUP_TOOLCHAIN=1.85.0 cargo build --locked --quiet --manifest-path "$tmp/$role/Cargo.toml" --bin nexus-cross-version-reader
            reader="$tmp/reader-$role"
            cp "$CARGO_TARGET_DIR/debug/nexus-cross-version-reader" "$reader"
            chmod 0700 "$reader"
            for case in "$tmp"/fixtures/valid-*.json; do
              "$reader" --snapshot "$case" w >/dev/null
              checks=$((checks+1))
            done
            for case in "$tmp"/fixtures/invalid-*.json; do
              if "$reader" --snapshot "$case" w >/dev/null 2>&1; then
                echo "NEXUS historical reader unexpectedly accepted an unsafe fixture: $role $(basename "$case")" >&2
                exit 1
              fi
              checks=$((checks+1))
            done
            echo "NEXUS historical Rust reader $role: synthetic accepted/refused contract PASS"
          done
          printf '{"status":"PASS","checks":%s,"scope":"three-actual-historical-rust-core-semantic-readers-synthetic-only","live_data_touched":false,"production_release_authorized":false}\n' "$checks"

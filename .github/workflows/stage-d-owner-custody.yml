name: NEXUS Owner Custody Readback Contract

on:
  pull_request:
    paths:
      - 'scripts/verify-stage-d-owner-custody.py'
      - 'scripts/test-stage-d-owner-custody.py'
      - 'docs/STAGE-D-OWNER-CUSTODY-READBACK.md'
      - '.github/workflows/stage-d-owner-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-local-contract:
    name: owner-custody-readback-contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Syntax and synthetic cross-filesystem contract
        run: |
          python3 -m py_compile scripts/verify-stage-d-owner-custody.py scripts/test-stage-d-owner-custody.py
          python3 scripts/test-stage-d-owner-custody.py

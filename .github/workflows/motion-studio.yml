name: NEXUS Motion Studio — Offline Video and Animation Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/motion-studio.yml'
      - 'artifact-05/src/lib.rs'
      - 'web/index.html'
      - 'web/motion*'
      - 'scripts/nexus-motion-render.py'
      - 'scripts/test-nexus-motion-render.py'
      - 'scripts/test-nexus-motion-core.mjs'
      - 'scripts/test-nexus-motion-browser.py'
      - 'docs/NEXUS-MOTION-STUDIO.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/motion-studio.yml'
      - 'artifact-05/src/lib.rs'
      - 'web/index.html'
      - 'web/motion*'
      - 'scripts/nexus-motion-render.py'
      - 'scripts/test-nexus-motion-render.py'
      - 'scripts/test-nexus-motion-core.mjs'
      - 'scripts/test-nexus-motion-browser.py'
      - 'docs/NEXUS-MOTION-STUDIO.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-motion-acceptance:
    name: local-motion-original-video-no-provider-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without retained token
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify native FFmpeg and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -filters | grep -w drawtext
          ffmpeg -hide_banner -encoders | grep -w libx264
          python3 -m py_compile scripts/nexus-motion-render.py scripts/test-nexus-motion-render.py scripts/test-nexus-motion-browser.py
          node --check web/motion-core.js
          node --check web/motion-ui.js
          node scripts/test-nexus-motion-core.mjs
      - name: Test 720p MP4 H264/AAC stream-by-scene and hostile media archive handling
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-nexus-motion-render.py
      - name: Exercise actual Chromium animation, local ZIP and real MediaRecorder
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-nexus-motion-browser.py
      - name: Verify Rust HTTP gateway still compiles with three pinned Motion routes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path artifact-05/Cargo.toml --lib --quiet

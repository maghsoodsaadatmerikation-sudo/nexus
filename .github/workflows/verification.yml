name: NEXUS Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nexus-constitutional-core/**'
      - 'artifact-05/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: echo 'preflight PASS'

  verify:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: echo 'verification PASS'

name: NEXUS Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'nexus-constitutional-core/**'
      - 'artifact-05/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Check pinned image reference
        run: |
          set -euo pipefail
          case "$RUST_IMAGE" in rust@sha256:*) ;; *) exit 1 ;; esac

  verify:
    name: Verification
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Verify repository invariants
        run: |
          set -euo pipefail
          test -f Cargo.lock
          test -f artifact-05/Cargo.lock
          echo 'Verification PASS'

  evidence:
    name: Evidence and Attestation
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Generate verification evidence
        run: |
          set -euo pipefail
          sha256sum Cargo.lock > verification-manifest.txt
          echo "Verified Commit: $GITHUB_SHA" >> verification-manifest.txt
          echo "Run ID: $GITHUB_RUN_ID" >> verification-manifest.txt
          echo "Status: PASS" >> verification-manifest.txt
          tar -czf verification-bundle.tar.gz verification-manifest.txt Cargo.lock
      - name: Attest verification bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: verification-bundle.tar.gz
      - name: Upload evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verification-bundle
          path: |
            verification-manifest.txt
            verification-bundle.tar.gz

  artifact_05:
    name: Artifact 05 Final
    needs: evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: GATE 0 — pinned environment and inputs
        run: |
          set -euo pipefail
          case "$RUST_IMAGE" in rust@sha256:*) ;; *) echo 'GATE 0 FAIL'; exit 1 ;; esac
          test -f artifact-05/Cargo.toml
          test -f artifact-05/Cargo.lock
          docker pull "$RUST_IMAGE"
          echo 'GATE 0 PASS'

      - name: GATE 1 — build
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo fmt -- --check; cargo build --locked'
          echo 'GATE 1 PASS'

      - name: GATE 2 — tests
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo test --locked; cargo test --doc --locked'
          echo 'GATE 2 PASS'

      - name: GATE 3 — evidence integrity
        run: |
          set -euo pipefail
          LOCK_HASH_BEFORE=$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')
          cat > artifact-05-verification.log <<EOF
[VERIFY] NEXUS Artifact 05 Contract
Verified Commit: $GITHUB_SHA
Run ID: $GITHUB_RUN_ID
Docker Reference: $RUST_IMAGE
Cargo.lock SHA-256 before: $LOCK_HASH_BEFORE
GATE 0 PASS
GATE 1 PASS
GATE 2 PASS
EOF
          LOCK_HASH_AFTER=$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')
          test "$LOCK_HASH_BEFORE" = "$LOCK_HASH_AFTER"
          printf 'Cargo.lock SHA-256 after: %s\nCargo.lock invariant: MATCH\nGATE 3 PASS\nStatus: PASS\n' "$LOCK_HASH_AFTER" >> artifact-05-verification.log
          LOG_HASH=$(sha256sum artifact-05-verification.log | awk '{print $1}')
          cat > artifact-05-verification-manifest.txt <<EOF
NEXUS Artifact 05 Verification Manifest
Protocol: NEXUS-Artifact-05-0.1
Status: PASS
Verified Commit: $GITHUB_SHA
Run ID: $GITHUB_RUN_ID
Docker Reference: $RUST_IMAGE
Cargo.lock SHA-256: $LOCK_HASH_AFTER
Verification Log SHA-256: $LOG_HASH
Verification Mode: locked
Invariant: Artifact 05 contract gates passed
EOF

      - name: Self-audit evidence
        run: |
          set -euo pipefail
          grep -q '^Status: PASS$' artifact-05-verification-manifest.txt
          grep -q "^Verified Commit: $GITHUB_SHA$" artifact-05-verification-manifest.txt
          grep -q '^Docker Reference: rust@sha256:' artifact-05-verification-manifest.txt
          grep -q '^Cargo.lock invariant: MATCH$' artifact-05-verification.log
          grep -q '^GATE 3 PASS$' artifact-05-verification.log
          test "$(grep '^Cargo.lock SHA-256:' artifact-05-verification-manifest.txt | cut -d' ' -f3)" = "$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')"
          test "$(grep '^Verification Log SHA-256:' artifact-05-verification-manifest.txt | cut -d' ' -f4)" = "$(sha256sum artifact-05-verification.log | awk '{print $1}')"
          echo '[SELF-AUDIT] PASS'

      - name: Bundle Artifact 05 evidence
        run: |
          set -euo pipefail
          tar -czf verification-bundle-artifact-05.tar.gz artifact-05-verification-manifest.txt artifact-05-verification.log artifact-05/Cargo.lock
          test -s verification-bundle-artifact-05.tar.gz

      - name: Attest Artifact 05 evidence
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: verification-bundle-artifact-05.tar.gz

      - name: Upload Artifact 05 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-05-final-evidence
          path: |
            artifact-05-verification.log
            artifact-05-verification-manifest.txt
            verification-bundle-artifact-05.tar.gz
          if-no-files-found: error

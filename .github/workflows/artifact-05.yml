name: NEXUS Artifact 05

on:
  push:
    branches:
      - artifact-05
      - artifact-05-hardening
      - prototype-0.2-gateway
  pull_request:
    branches:
      - main
    paths:
      - artifact-05/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - scripts/verify_artifact_05_boundary.sh
      - .github/workflows/artifact-05.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Artifact 05 contract
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: artifact-05
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust 1.85.0
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Generate development lockfile
        run: cargo generate-lockfile

      - name: Formatting
        run: cargo fmt -- --check

      - name: Static authority-boundary check
        run: bash ../scripts/verify_artifact_05_boundary.sh

      - name: Build
        run: cargo build

      - name: Contract tests
        run: cargo test

      - name: Documentation tests
        run: cargo test --doc

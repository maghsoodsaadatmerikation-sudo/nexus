name: NEXUS Artifact 05

on:
  push:
    branches: [main, artifact-05, artifact-05-hardening, prototype-0.2-gateway-boundary]
  pull_request:
    branches: [main]
    paths:
      - 'artifact-05/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/artifact-05.yml'
  workflow_dispatch:

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

permissions:
  contents: read

jobs:
  contract:
    name: Artifact 05 contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify pinned environment
        run: |
          set -euo pipefail
          test "${RUST_IMAGE#rust@sha256:}" != "$RUST_IMAGE"
          docker pull "$RUST_IMAGE"
          docker run --rm "$RUST_IMAGE" sh -c 'rustc --version && cargo --version'

      - name: Enforce transport-only boundary
        run: |
          set -euo pipefail
          ! grep -Eq 'PolicyEngine::|Executor::|\.authorize\(|\.execute\(' artifact-05/src/lib.rs

      - name: Generate Artifact 05 lockfile and run contract gates
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/artifact-05 \
            "$RUST_IMAGE" \
            sh -c '
              cargo generate-lockfile
              cargo fmt -- --check
              cargo build --locked
              cargo test --all-targets --locked
              cargo test --doc --locked
            '

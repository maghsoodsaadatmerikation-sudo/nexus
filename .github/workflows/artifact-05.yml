name: NEXUS Artifact 05

on:
  push:
    branches:
      - artifact-05
      - artifact-05-hardening
      - prototype-0.2-gateway
  pull_request:
    branches:
      - main
    paths:
      - artifact-05/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - scripts/verify_artifact_05_boundary.sh
      - .github/workflows/artifact-05.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  contract:
    name: Artifact 05 contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify pinned toolchain identity
        run: |
          docker pull "$RUST_IMAGE"
          docker run --rm "$RUST_IMAGE" sh -c 'rustc --version && cargo --version'

      - name: Generate development lockfile
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/artifact-05 \
            "$RUST_IMAGE" \
            cargo generate-lockfile

      - name: Formatting
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/artifact-05 \
            "$RUST_IMAGE" \
            cargo fmt -- --check

      - name: Static authority-boundary check
        run: bash scripts/verify_artifact_05_boundary.sh

      - name: Build
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/artifact-05 \
            "$RUST_IMAGE" \
            cargo build --locked

      - name: Contract tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/artifact-05 \
            "$RUST_IMAGE" \
            cargo test --locked

      - name: Documentation tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/artifact-05 \
            "$RUST_IMAGE" \
            cargo test --doc --locked

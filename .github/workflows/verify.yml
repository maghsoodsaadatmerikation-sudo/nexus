name: NEXUS Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Preflight probe
        run: echo "preflight PASS"

  verify:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Verification probe
        run: echo "verification PASS"

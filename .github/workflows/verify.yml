name: NEXUS Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Verification mode
        required: true
        default: verify
        type: choice
        options:
          - bootstrap
          - verify

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Python
        run: sudo apt-get update && sudo apt-get install -y python3
      - name: Static verification matrix
        run: python3 scripts/verify_test_matrix.py

  verify:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Verify pinned environment and gates
        env:
          RUST_IMAGE: ${{ env.RUST_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/verify-docker.sh

      - name: Self-audit verification evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/verify-manifest.sh verification-manifest.txt "build_verification_${GITHUB_RUN_ID}.log"

      - name: Bundle verification evidence
        run: tar -czf verification-bundle.tar.gz verification-manifest.txt "build_verification_${GITHUB_RUN_ID}.log" Cargo.lock

      - name: Attest verification bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: verification-bundle.tar.gz

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verification-bundle
          path: |
            verification-bundle.tar.gz
            verification-manifest.txt
            build_verification_*.log
            Cargo.lock
          if-no-files-found: error

      - name: Artifact 05 — GATE 0
        run: |
          set -euo pipefail
          case "$RUST_IMAGE" in rust@sha256:*) ;; *) echo 'GATE 0 FAIL'; exit 1 ;; esac
          docker pull "$RUST_IMAGE"
          test -f artifact-05/Cargo.toml
          test -f artifact-05/Cargo.lock
          echo 'GATE 0 PASS'

      - name: Artifact 05 — GATE 1
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo fmt -- --check; cargo build --locked'
          echo 'GATE 1 PASS'

      - name: Artifact 05 — GATE 2
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo test --locked; cargo test --doc --locked'
          echo 'GATE 2 PASS'

      - name: Artifact 05 — GATE 3 and evidence
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE=$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')
          printf '%s\n' '[VERIFY] NEXUS Artifact 05 Contract' "Verified Commit: $VERIFIED_SHA" "Run ID: $GITHUB_RUN_ID" "Docker Reference: $RUST_IMAGE" "Cargo.lock SHA-256 before: $BEFORE" 'GATE 0 PASS' 'GATE 1 PASS' 'GATE 2 PASS' > artifact-05-verification.log
          AFTER=$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')
          test "$BEFORE" = "$AFTER"
          echo "Cargo.lock SHA-256 after: $AFTER" >> artifact-05-verification.log
          echo 'Cargo.lock invariant: MATCH' >> artifact-05-verification.log
          echo 'GATE 3 PASS' >> artifact-05-verification.log
          echo 'Status: PASS' >> artifact-05-verification.log
          LOCK_HASH="$AFTER"
          LOG_HASH=$(sha256sum artifact-05-verification.log | awk '{print $1}')
          cat > artifact-05-verification-manifest.txt <<EOF
NEXUS Artifact 05 Verification Manifest
========================================
Protocol: NEXUS-Artifact-05-0.1
Status: PASS
Verified Commit: $VERIFIED_SHA
Run ID: $GITHUB_RUN_ID
Docker Reference: $RUST_IMAGE
Cargo.lock SHA-256: $LOCK_HASH
Verification Log SHA-256: $LOG_HASH
Verification Mode: locked
Invariant: Artifact 05 contract gates passed
EOF
          grep -q '^Status: PASS$' artifact-05-verification-manifest.txt
          grep -q "^Verified Commit: $VERIFIED_SHA$" artifact-05-verification-manifest.txt
          test "$(grep '^Cargo.lock SHA-256:' artifact-05-verification-manifest.txt | cut -d' ' -f3)" = "$AFTER"
          test "$(grep '^Verification Log SHA-256:' artifact-05-verification-manifest.txt | cut -d' ' -f4)" = "$LOG_HASH"
          echo '[SELF-AUDIT] PASS'

      - name: Artifact 05 — bundle and attest
        run: |
          set -euo pipefail
          tar -czf verification-bundle-artifact-05.tar.gz artifact-05-verification-manifest.txt artifact-05-verification.log artifact-05/Cargo.lock
          test -s verification-bundle-artifact-05.tar.gz

      - name: Artifact 05 — attest evidence bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: verification-bundle-artifact-05.tar.gz

      - name: Artifact 05 — upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-05-final-evidence
          path: |
            artifact-05-verification.log
            artifact-05-verification-manifest.txt
            verification-bundle-artifact-05.tar.gz
          if-no-files-found: error

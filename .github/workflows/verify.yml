name: NEXUS Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Python
        run: sudo apt-get update && sudo apt-get install -y python3
      - name: Static verification matrix
        run: python3 scripts/verify_test_matrix.py

  verify:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Verify pinned environment and gates
        env:
          RUST_IMAGE: ${{ env.RUST_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/verify-docker.sh

      - name: Self-audit verification evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/verify-manifest.sh verification-manifest.txt "build_verification_${GITHUB_RUN_ID}.log"

      - name: Bundle verification evidence
        run: tar -czf verification-bundle.tar.gz verification-manifest.txt "build_verification_${GITHUB_RUN_ID}.log" Cargo.lock

      - name: Attest verification bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: verification-bundle.tar.gz

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verification-bundle
          path: |
            verification-bundle.tar.gz
            verification-manifest.txt
            build_verification_*.log
            Cargo.lock
          if-no-files-found: error

      - name: Artifact 05 GATE 0
        run: |
          set -euo pipefail
          case "$RUST_IMAGE" in rust@sha256:*) ;; *) echo 'GATE 0 FAIL'; exit 1 ;; esac
          docker pull "$RUST_IMAGE"
          test -f artifact-05/Cargo.toml
          test -f artifact-05/Cargo.lock
          test -f web/index.html
          echo 'GATE 0 PASS'

      - name: Artifact 05 GATE 1
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo fmt -- --check; cargo build --locked'
          echo 'GATE 1 PASS'

      - name: Artifact 05 GATE 2
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/artifact-05 "$RUST_IMAGE" sh -euxc 'cargo test --locked; cargo test --doc --locked'
          echo 'GATE 2 PASS'

      - name: Artifact 05 GATE 3 evidence integrity
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          lock_sha="$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')"
          toml_sha="$(sha256sum artifact-05/Cargo.toml | awk '{print $1}')"
          source_sha="$(find artifact-05/src artifact-05/tests -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          web_sha="$(sha256sum web/index.html | awk '{print $1}')"
          printf '%s\n' \
            'Status: PASS' \
            "Verified Commit: ${GITHUB_SHA}" \
            "Run ID: ${GITHUB_RUN_ID}" \
            "Docker Reference: ${RUST_IMAGE}" \
            'GATE 0: PASS' \
            'GATE 1: PASS' \
            'GATE 2: PASS' \
            "Artifact 05 Cargo.lock SHA-256: ${lock_sha}" \
            "Artifact 05 Cargo.toml SHA-256: ${toml_sha}" \
            "Artifact 05 Source Tree SHA-256: ${source_sha}" \
            "Web Workspace SHA-256: ${web_sha}" \
            > artifact-05-verification-manifest.txt
          grep -Fx 'Status: PASS' artifact-05-verification-manifest.txt
          grep -Fx "Verified Commit: ${GITHUB_SHA}" artifact-05-verification-manifest.txt
          grep -Fx "Docker Reference: ${RUST_IMAGE}" artifact-05-verification-manifest.txt
          case "$RUST_IMAGE" in rust@sha256:*) ;; *) exit 1 ;; esac
          test "$(sha256sum artifact-05/Cargo.lock | awk '{print $1}')" = "$lock_sha"
          test "$(sha256sum artifact-05/Cargo.toml | awk '{print $1}')" = "$toml_sha"
          test "$(find artifact-05/src artifact-05/tests -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')" = "$source_sha"
          test "$(sha256sum web/index.html | awk '{print $1}')" = "$web_sha"
          echo 'GATE 3 PASS'

      - name: Bundle Artifact 05 verification evidence
        run: |
          set -euo pipefail
          tar -czf artifact-05-verification-bundle.tar.gz \
            artifact-05-verification-manifest.txt \
            artifact-05/Cargo.toml \
            artifact-05/Cargo.lock \
            artifact-05/src \
            artifact-05/tests \
            web/index.html

      - name: Attest Artifact 05 verification bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: artifact-05-verification-bundle.tar.gz

      - name: Upload Artifact 05 verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-05-verification-bundle
          path: |
            artifact-05-verification-bundle.tar.gz
            artifact-05-verification-manifest.txt
            artifact-05/Cargo.toml
            artifact-05/Cargo.lock
            web/index.html
          if-no-files-found: error

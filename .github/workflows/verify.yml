name: NEXUS Verification

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify v1.5 promotion-safety contract
        run: |
          set -euo pipefail
          bash -n scripts/v1.5-promotion-safety.sh
          bash scripts/v1.5-promotion-safety.sh

      - name: Build v1.5 release-candidate manifest
        run: |
          set -euo pipefail
          bash -n scripts/v1.5-release-candidate.sh
          bash scripts/v1.5-release-candidate.sh "${GITHUB_SHA}" "${GITHUB_RUN_ID}" v1.5-release-candidate-manifest.txt

      - name: Verify v1.4 deployment-truth contract
        run: |
          set -euo pipefail
          bash -n scripts/v1.4-deployment-truth.sh
          bash scripts/v1.4-deployment-truth.sh

      - name: Build v1.4 release-candidate manifest
        run: |
          set -euo pipefail
          bash -n scripts/v1.4-release-candidate.sh
          bash scripts/v1.4-release-candidate.sh "${GITHUB_SHA}" "${GITHUB_RUN_ID}" v1.4-release-candidate-manifest.txt

      - name: Verify v1.3 production-hardening contract
        run: |
          set -euo pipefail
          bash -n scripts/v1.3-production-hardening.sh
          bash scripts/v1.3-production-hardening.sh

      - name: Verify v1.2 release-boundary integrity
        run: |
          set -euo pipefail
          bash -n scripts/v1.2-boundary-integrity.sh
          bash scripts/v1.2-boundary-integrity.sh

      - name: Verify v1.2 continuous-verification contract
        run: |
          set -euo pipefail
          bash -n scripts/v1.2-continuous-verification.sh
          bash scripts/v1.2-continuous-verification.sh

      - name: Verify v1.2 durable-state resilience contract
        run: |
          set -euo pipefail
          bash -n scripts/v1.2-durable-state-resilience.sh
          bash scripts/v1.2-durable-state-resilience.sh

      - name: Verify v1.2 operational-economy contract
        run: |
          set -euo pipefail
          bash -n scripts/v1.2-operational-economy.sh
          bash scripts/v1.2-operational-economy.sh

      - name: Build v1.2 release-candidate manifest
        run: |
          set -euo pipefail
          bash -n scripts/v1.2-release-candidate.sh
          bash scripts/v1.2-release-candidate.sh "${GITHUB_SHA}" "${GITHUB_RUN_ID}" v1.2-release-candidate-manifest.txt

      - name: Run reusable read-only verification harness
        env:
          RUST_IMAGE: ${{ env.RUST_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/readonly-verification.sh

      - name: Test lifecycle-bound Stage D release gates
        run: |
          set -euo pipefail
          bash -n scripts/test-stage-d-readiness.sh
          bash scripts/test-stage-d-readiness.sh

      - name: Verify durable-host deployment configuration
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/verify-render-blueprint.sh

      - name: Attest constitutional-core verification bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: verification-bundle.tar.gz

      - name: Upload constitutional-core verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verification-bundle
          path: |
            verification-bundle.tar.gz
            verification-manifest.txt
            build_verification_*.log
            Cargo.lock
            scripts/readonly-verification.sh
            scripts/v1.2-boundary-integrity.sh
            scripts/v1.2-continuous-verification.sh
            scripts/v1.2-durable-state-resilience.sh
            scripts/v1.2-operational-economy.sh
            scripts/v1.2-release-candidate.sh
            scripts/v1.3-production-hardening.sh
            scripts/v1.4-deployment-truth.sh
            scripts/v1.4-release-candidate.sh
            scripts/v1.5-promotion-safety.sh
            scripts/v1.5-release-candidate.sh
            docs/V1.3-ROADMAP.md
            docs/V1.4-ROADMAP.md
            docs/V1.4-RELEASE-GATE.md
            docs/V1.5-ROADMAP.md
            docs/V1.5-RELEASE-GATE.md
            evidence/live-deployment-state.json
            v1.2-release-candidate-manifest.txt
            v1.4-release-candidate-manifest.txt
            v1.5-release-candidate-manifest.txt
          if-no-files-found: error

      - name: Attest Artifact 05 verification bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: artifact-05-verification-bundle.tar.gz

      - name: Upload Artifact 05 verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: artifact-05-verification-bundle
          path: |
            artifact-05-verification-bundle.tar.gz
            artifact-05-verification-manifest.txt
            artifact-05/Cargo.toml
            artifact-05/Cargo.lock
            web/index.html
            Dockerfile
            scripts/workspace-backup.sh
            scripts/workspace-restore.sh
            scripts/stage-d-evidence.sh
            scripts/v1.1-release-readiness.sh
            scripts/v1.1-release-candidate.sh
            scripts/test-stage-d-readiness.sh
            scripts/readonly-verification.sh
            scripts/v1.2-boundary-integrity.sh
            scripts/v1.2-continuous-verification.sh
            scripts/v1.2-durable-state-resilience.sh
            scripts/v1.2-operational-economy.sh
            scripts/v1.2-release-candidate.sh
            scripts/v1.3-production-hardening.sh
            scripts/v1.4-deployment-truth.sh
            scripts/v1.4-release-candidate.sh
            scripts/v1.5-promotion-safety.sh
            scripts/v1.5-release-candidate.sh
            v1.2-release-candidate-manifest.txt
            v1.4-release-candidate-manifest.txt
            v1.5-release-candidate-manifest.txt
            evidence/live-deployment-state.json
            docs/DEPLOYMENT.md
            docs/OBSERVABILITY.md
            docs/STAGE-D-EVIDENCE.md
            docs/RENDER-STAGE-D.md
            docs/RELEASE-READINESS-v1.1.md
            docs/RELEASE-CANDIDATE-v1.1.md
            docs/ROADMAP-v1.1.md
            docs/V1.2-ROADMAP.md
            docs/V1.2-DURABLE-STATE.md
            docs/V1.2-OPERATIONAL-ECONOMY.md
            docs/V1.2-RELEASE-GATE.md
            docs/V1.3-ROADMAP.md
            docs/V1.4-ROADMAP.md
            docs/V1.4-RELEASE-GATE.md
            docs/V1.5-ROADMAP.md
            docs/V1.5-RELEASE-GATE.md
            docs/RELEASE-v1.1.0.md
            docs/RELEASE-v1.2.0.md
            docs/RELEASE-v1.3.0.md
            docs/RELEASE-v1.4.0.md
          if-no-files-found: error

      - name: Attest Render Stage D configuration bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: render-deployment-bundle.tar.gz

      - name: Upload Render Stage D configuration evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: render-stage-d-configuration
          path: |
            render-deployment-bundle.tar.gz
            render-deployment-manifest.txt
            render.yaml
            scripts/verify-render-blueprint.sh
            docs/RENDER-STAGE-D.md
          if-no-files-found: error

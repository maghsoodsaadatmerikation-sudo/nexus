name: NEXUS Cloud Adapter Evidence

on:
  push:
    branches: [main]
    paths:
      - "nexus-cloud/**"
      - "scripts/cloud-adapter-evidence.sh"
      - ".github/workflows/cloud-adapter.yml"
      - ".github/workflows/cloud-adapter-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.4"
          enable-cache: "false"
          working-directory: nexus-cloud

      - name: Install project Python
        working-directory: nexus-cloud
        run: uv python install 3.13

      - name: Verify, generate, and self-audit transport evidence
        env:
          VERIFIED_COMMIT: ${{ github.sha }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: bash scripts/cloud-adapter-evidence.sh

      - name: Attest transport evidence bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: nexus-cloud-verification-bundle.tar.gz

      - name: Upload transport evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-cloud-verification-evidence
          path: |
            nexus-cloud-verification-bundle.tar.gz
            nexus-cloud-verification-bundle.sha256
            nexus-cloud-verification-manifest.txt
          if-no-files-found: error

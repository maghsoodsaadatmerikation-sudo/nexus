name: NEXUS Static Pilot HTTPS Identity

on:
  pull_request:
    paths:
      - 'scripts/verify-public-static-pilot.py'
      - '.github/workflows/static-pilot-https.yml'
      - 'web/offline-pilot.html'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-public-static-pilot.py'
      - '.github/workflows/static-pilot-https.yml'
      - 'web/offline-pilot.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer:
    name: static-pilot-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify observer rejects bad HTTP and unexpected payloads
        run: python3 scripts/verify-public-static-pilot.py --self-test
      - name: Independently fetch public static pilot (PR and main)
        run: |
          set -euo pipefail
          # Live Render autoDeploy is OFF. Compare *all* events against the
          # last independently verified DEPLOYED source, never silently
          # against a newer unpromoted main-branch candidate.
          baseline="24644558cfe96f8f1a725986efbe94e1710032f2"
          git show "$baseline:web/offline-pilot.html" > /tmp/nexus-current-deployed-pilot.html
          python3 scripts/verify-public-static-pilot.py \
            --expected /tmp/nexus-current-deployed-pilot.html > static-pilot-https-report.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("static-pilot-https-report.json")
          report=json.loads(p.read_text())
          candidate_hash=hashlib.sha256(Path("web/offline-pilot.html").read_bytes()).hexdigest()
          report["verified_basis"]="pinned_live_deployment"
          report["deployed_source_commit"]="24644558cfe96f8f1a725986efbe94e1710032f2"
          report["source_candidate_sha256"]=candidate_hash
          report["source_candidate_currently_live"]=(candidate_hash==report.get("observed_sha256"))
          p.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          if report["source_candidate_currently_live"]:
              print("STATIC PILOT: source candidate matches the independently observed live HTML.")
          else:
              print("STATIC PILOT: verified existing live revision; newer source candidate NOT deployed.")
          PY
          python3 - <<'PY'
          import json
          report=json.load(open('static-pilot-https-report.json'))
          assert report["status"]=="PASS_STATIC_HTTPS_IDENTITY"
          assert report["http_status"]==200
          assert report["matched_exact_html"] is True
          assert report["authority"]=="none"
          assert report["production_mutation"] is False
          assert report["authenticated_live_user"] is False
          assert report["verified_basis"]=="pinned_live_deployment"
          assert report["deployed_source_commit"]=="24644558cfe96f8f1a725986efbe94e1710032f2"
          print("NEXUS STATIC PILOT: PASS exact currently deployed HTTPS HTML")
          PY
      - name: Upload sanitized read-only report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-static-pilot-https-identity
          path: static-pilot-https-report.json
          if-no-files-found: ignore
          retention-days: 30

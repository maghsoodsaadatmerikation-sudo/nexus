name: NEXUS Railway Staged Change Review Contract

on:
  pull_request:
    paths:
      - 'scripts/review-railway-staged-change.py'
      - 'scripts/test-review-railway-staged-change.py'
      - 'docs/RAILWAY-STAGED-PATCH-REVIEW.md'
      - '.github/workflows/railway-staged-change-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-change-fixture-contract:
    name: railway-staged-change-contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout exact current PR snapshot without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile scripts/review-railway-staged-change.py scripts/test-review-railway-staged-change.py
      - name: Contract tests without network or provider secrets
        run: python3 scripts/test-review-railway-staged-change.py

name: NEXUS Structural Integration Rehearsal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  independent-integration:
    name: independent-integration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run actual Rust Docker and API recovery verification
        env:
          RUST_IMAGE: ${{ env.RUST_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
        run: bash scripts/readonly-verification.sh

      - name: Prove all four structural repairs coexist
        run: |
          set -euo pipefail
          python3 scripts/test-workflow-authority.py
          python3 scripts/scripts/verify_test_matrix.py
          python3 scripts/verify-workflow-authority.py
          python3 scripts/test-pr-merge-freshness.py
          python3 scripts/test-render-manual-deployment.py
          python3 scripts/verify-render-manual-deployment.py
          python3 scripts/test-render-readiness.py
          python3 scripts/test-workspace-backup.py
          python3 scripts/test-workspace-restore.py
          python3 scripts/test-stage-d-private-observation.py
          bash scripts/test-stage-d-readiness.sh
          bash scripts/v1.2-durable-state-resilience.sh
          python3 scripts/test-durable-state-contract.py

      - name: Verify Render configuration without accessing provider
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/verify-render-blueprint.sh

name: NEXUS Studio Current-Live Complete Public Source Fallback

on:
  pull_request:
    paths:
      - 'scripts/studio-live-source-fallback.py'
      - 'scripts/test-studio-live-source-fallback.py'
      - 'scripts/studio-source-restore-drill.py'
      - 'scripts/test-studio-source-restore-drill.py'
      - 'scripts/studio-full-origin-observer.py'
      - 'scripts/studio_public_assets.py'
      - 'scripts/png_pixels.py'
      - '.github/workflows/studio-live-source-fallback.yml'
      - 'docs/STUDIO-LIVE-ROLLBACK-FALLBACK.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-live-public-source-fallback:
    name: fallback-seventeen-live-source-hashes-no-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed candidate code without saved credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: review
          persist-credentials: false
      - name: Checkout immutable current live Render source snapshot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 826c91e2053f716b9aa7e40713f3c568e5272eba
          path: previous-live
          persist-credentials: false
      - name: Reject ambient provider credentials and unexpected live Git commit
        shell: bash
        run: |
          set -euo pipefail
          test -z "${RENDER_API_KEY:-}"
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${NEXUS_MODEL_API_KEY:-}"
          test "$(git -C previous-live rev-parse HEAD)" = "826c91e2053f716b9aa7e40713f3c568e5272eba"
          test "$(git -C review rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify synthetic negative cases, archive reproducibility and exact live SHA
        working-directory: review
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/studio-live-source-fallback.py scripts/test-studio-live-source-fallback.py scripts/studio-full-origin-observer.py
          python3 scripts/test-studio-live-source-fallback.py
          python3 scripts/test-studio-source-restore-drill.py
      - name: Compare currently-live fixed public HTTPS origin to pinned Render source
        working-directory: review
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/studio-live-source-fallback.py --build \
            --old-root "$GITHUB_WORKSPACE/previous-live" \
            --zip "$RUNNER_TEMP/nexus-studio-previous-live-source.zip" \
            --report "$RUNNER_TEMP/nexus-studio-previous-live-witness.json"
          python3 scripts/studio-live-source-fallback.py --verify \
            --zip "$RUNNER_TEMP/nexus-studio-previous-live-source.zip" \
            --report "$RUNNER_TEMP/nexus-studio-previous-live-witness.json"
          sha256sum "$RUNNER_TEMP/nexus-studio-previous-live-source.zip" \
            > "$RUNNER_TEMP/nexus-studio-previous-live-source.zip.sha256"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'nexus-studio-previous-live-witness.json').read_text())
          assert report['origin_matches_pinned_live_source'] is True
          assert len(report['observed_paths'])==17
          assert report['reviewed_file_count']==17
          assert len(report['source_assets'])==17
          assert {item['path'] for item in report['observed_paths']}==set(report['source_assets'])
          assert report['provider_metadata_rechecked_during_workflow'] is False
          for item in report['observed_paths']:
            if item['path'] in {'icons/nexus-192.png','icons/nexus-512.png'}:
              assert item['status'] in {'MATCH','PIXEL_MATCH'}
            else:
              assert item['status']=='MATCH'
          assert report['png_icons_compared_by_rgba_pixels'] is True
          assert report['production_deploy_executed'] is False
          assert report['actual_rollback_executed'] is False
          assert report['rollback_render_build_artifact_confirmed'] is False
          print('CURRENT LIVE 17-ASSET SOURCE SNAPSHOT MATCHED, PROVIDER ROLLBACK STILL UNVERIFIED')
          PY
      - name: Reconstitute verified public source ZIP in disposable local root
        working-directory: review
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/studio-source-restore-drill.py --restore \
            --zip "$RUNNER_TEMP/nexus-studio-previous-live-source.zip" \
            --manifest "$RUNNER_TEMP/nexus-studio-previous-live-witness.json" \
            --dest "$RUNNER_TEMP/nexus-studio-restored-public" \
            --report "$RUNNER_TEMP/nexus-studio-restore-drill.json"
          python3 scripts/studio-source-restore-drill.py --verify \
            --zip "$RUNNER_TEMP/nexus-studio-previous-live-source.zip" \
            --manifest "$RUNNER_TEMP/nexus-studio-previous-live-witness.json" \
            --dest "$RUNNER_TEMP/nexus-studio-restored-public" \
            --report "$RUNNER_TEMP/nexus-studio-restore-drill.json"
      - name: Exercise historical restored source with isolated real Chromium, synthetic private storage
        working-directory: review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexus-studio-restored-public/scripts"
          cp "$GITHUB_WORKSPACE/previous-live/scripts/test-studio-static-browser.mjs" \
            "$RUNNER_TEMP/nexus-studio-restored-public/scripts/test-studio-static-browser.mjs"
          export NEXUS_PWA_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$NEXUS_PWA_CHROME"
          unset NEXUS_STUDIO_PACKAGE_DIR
          node --check "$RUNNER_TEMP/nexus-studio-restored-public/scripts/test-studio-static-browser.mjs"
          node "$RUNNER_TEMP/nexus-studio-restored-public/scripts/test-studio-static-browser.mjs" \
            > "$RUNNER_TEMP/nexus-studio-restore-browser.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((root/"nexus-studio-restore-drill.json").read_text())
          b=json.loads((root/"nexus-studio-restore-browser.json").read_text())
          assert a["source_exact_bytes_reconstituted"] is True
          assert a["restored_public_files"] == 17
          assert a["actual_render_rollback_executed"] is False
          assert a["render_build_artifact_retained_confirmed"] is False
          assert b["status"] == "PASS" and b["authority"] == "none"
          assert b["source_sha256"] == a["restored_html_sha256"]
          assert b["origin"].startswith("http://127.0.0.1:")
          assert b["actual_offline_navigation"] is True
          assert b["real_model_tested"] is False and b["real_android_hardware"] is False
          assert len(b["checks"]) >= 15
          print("RESTORED SOURCE LOCAL CHROMIUM: PASS; RENDER ROLLBACK STILL UNVERIFIED")
          PY
      - name: Store source fallback ZIP and independent SHA plus public origin evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-studio-previous-live-source-fallback
          path: |
            ${{ runner.temp }}/nexus-studio-previous-live-source.zip
            ${{ runner.temp }}/nexus-studio-previous-live-source.zip.sha256
            ${{ runner.temp }}/nexus-studio-previous-live-witness.json
            ${{ runner.temp }}/nexus-studio-restore-drill.json
            ${{ runner.temp }}/nexus-studio-restore-browser.json
          if-no-files-found: error
          retention-days: 30

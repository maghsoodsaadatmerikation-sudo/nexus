name: NEXUS Stage 24 — Read-Only Publication Review
on:
  pull_request:
    branches:
      - feat/work-mode-20261113
    paths:
      - '.github/workflows/stage24-static-site.yml'
      - '.github/workflows/stage24-publish-branch.yml'
      - 'scripts/stage24-static-publish-check.py'
      - 'scripts/test-stage24-static-publish.py'
      - 'docs/STAGE-24-STATIC-SNAPSHOT-AND-PAGES.md'
permissions:
  contents: read

jobs:
  verify-snapshot:
    name: exact-source-static-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact proposed commit with no persisted credential
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert no privileged provider credentials and exact build provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${RAILWAY_TOKEN:-}"
          test -z "${RAILWAY_API_TOKEN:-}"
          test -z "${NEXUS_API_TOKEN:-}"
          test -z "${RENDER_API_KEY:-}"
          python3 -m py_compile scripts/stage24-static-publish-check.py scripts/test-stage24-static-publish.py
          node --check scripts/test-mobile-work-pwa-browser.mjs

      - name: Recheck current Stage 23 adversarial safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-work-mode-portable.py
          python3 scripts/test-mobile-work-pwa.py
          python3 scripts/test-stage24-static-publish.py

      - name: Build independently and reject unrelated files, changed source or bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-mobile-work-pwa.py --out build/stage24-site
          python3 scripts/build-mobile-work-pwa.py --out build/stage24-site --check
          python3 scripts/stage24-static-publish-check.py --site build/stage24-site
          node --check build/stage24-site/service-worker.js
          test -f build/stage24-site/.nojekyll

      - name: Real Chromium consent, tamper rejection and true offline reopening
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_STAGE23_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$NEXUS_STAGE23_CHROME"
          node scripts/test-mobile-work-pwa-browser.mjs build/stage24-site > build/stage24-browser-witness.json
          python3 - <<'PY'
          import json
          data=json.load(open('build/stage24-browser-witness.json'))
          assert data['status']=='PASS' and len(data['reports'])==2
          assert all(len(v['checks'])>=11 for v in data['reports'])
          assert data['production_deployed'] is False and data['real_android_tested'] is False
          print('PASS: 2 independent synthetic Chromium layouts; 0 production claims')
          PY

      - name: Upload exact static-only, public-reviewable candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-stage24-reviewed-site
          path: build/stage24-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload synthetic acceptance evidence, no private payloads
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-stage24-offline-witness
          path: build/stage24-browser-witness.json
          if-no-files-found: error
          retention-days: 30


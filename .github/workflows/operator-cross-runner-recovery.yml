name: NEXUS Operator Cross-Runner Recovery (Synthetic)
on:
  pull_request:
    paths:
      - 'scripts/test-operator-cross-runner.py'
      - 'scripts/nexus-operator-snapshot.py'
      - 'nexus-cloud/agent_workspace.py'
      - 'nexus-cloud/agent_journal.py'
      - 'nexus-cloud/agent_host_census.py'
      - 'nexus-cloud/tests/test_agent_cross_runner.py'
      - 'docs/PHASE29-CROSS-RUNNER-RECOVERY.md'
      - '.github/workflows/operator-cross-runner-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  export_runner:
    # Only synthetic data. Separate completed job precedes restoration runner.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 7
    outputs:
      archive_sha256: ${{ steps.evidence.outputs.archive_sha256 }}
      workspace_sha256: ${{ steps.evidence.outputs.workspace_sha256 }}
      source_sha: ${{ steps.evidence.outputs.source_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout reviewed PR head without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Export synthetic journal and offline ZIP into disposable private root
        id: evidence
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          mkdir -m 700 "$RUNNER_TEMP/nexus-p29-producer"
          python3 -B scripts/test-operator-cross-runner.py produce \
            --scratch "$RUNNER_TEMP/nexus-p29-producer" \
            --approve-synthetic-ci \
            > "$RUNNER_TEMP/nexus-p29-source-report.json"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          report = json.loads(Path(os.environ['RUNNER_TEMP'], 'nexus-p29-source-report.json').read_text())
          if report.get('status') != 'cross-runner-synthetic-exported' or report.get('synthetic_only') is not True:
              raise SystemExit('Refuse non-synthetic export')
          digest = report['snapshot_sha256']
          workspace = report['workspace_sha256']
          if not re.fullmatch(r'[0-9a-f]{64}', digest) or not re.fullmatch(r'[0-9a-f]{64}', workspace):
              raise SystemExit('Invalid report hashes')
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}', head):
              raise SystemExit('Invalid checkout SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'archive_sha256={digest}\nworkspace_sha256={workspace}\nsource_sha={head}\n')
          print(json.dumps({'synthetic_export_verified': True, 'source_sha': head,
                            'archive_sha256': digest, 'production_ready': False}))
          PY
      - name: Transfer only synthetic ZIP to GitHub artifact storage
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-operator-cross-runner-synthetic-plaintext-only
          path: ${{ runner.temp }}/nexus-p29-producer/transfer/snapshot.zip
          retention-days: 1
          if-no-files-found: error

  restore_runner:
    # A new disposable runner has no access to the producer source directory.
    # Archive SHA is passed as a separate job output, not read from the ZIP.
    runs-on: ubuntu-24.04
    needs: export_runner
    permissions:
      contents: read
    timeout-minutes: 7
    steps:
      - name: Checkout same source SHA on the separate runner
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ needs.export_runner.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download only artifact created by this producer job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.export_runner.outputs.artifact_id }}
          path: ${{ runner.temp }}/nexus-p29-received
      - name: Reject wrong hashes/corruption and restore exact finished receipt
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.export_runner.outputs.archive_sha256 }}
          EXPECTED_WORKSPACE_SHA256: ${{ needs.export_runner.outputs.workspace_sha256 }}
          SOURCE_SHA: ${{ needs.export_runner.outputs.source_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # The download action isolates each artifact under its name.
          archive="$RUNNER_TEMP/nexus-p29-received/nexus-operator-cross-runner-synthetic-plaintext-only/snapshot.zip"
          test -f "$archive" && test ! -L "$archive"
          chmod 700 "$RUNNER_TEMP/nexus-p29-received"
          chmod 600 "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          mkdir -m 700 "$RUNNER_TEMP/nexus-p29-restored"
          python3 -B scripts/test-operator-cross-runner.py receive \
            --scratch "$RUNNER_TEMP/nexus-p29-restored" \
            --archive "$archive" \
            --expected-sha256 "$EXPECTED_ARCHIVE_SHA256" \
            --expected-workspace-sha256 "$EXPECTED_WORKSPACE_SHA256" \
            --approve-synthetic-ci
          printf 'Distinct GitHub Actions jobs checked source SHA: %s\n' "$SOURCE_SHA"

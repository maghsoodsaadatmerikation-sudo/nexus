name: NEXUS Studio Verification
on:
  pull_request:
    paths:
      - 'web/studio*'
      - 'web/vendor/**'
      - 'web/table-core.js'
      - 'scripts/*studio*'
      - 'scripts/test-analysis-*.mjs'
      - 'nexus-cloud/**'
      - 'artifact-05/src/lib.rs'
      - '.github/workflows/studio.yml'
  push:
    branches: [main]
    paths:
      - 'web/studio*'
      - 'web/vendor/**'
      - 'web/table-core.js'
      - 'scripts/*studio*'
      - 'scripts/test-analysis-*.mjs'
      - '.github/workflows/studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify deterministic bundle and bounded state
        run: |
          python3 scripts/test-studio-module-graph.py
          python3 scripts/build-studio.py --check
          node --check web/studio-core.js
          node --check web/studio-app.js
          node --check web/studio-vision-ui.js
          node --check web/studio-locales.js
          node scripts/test-studio-locales.mjs
          node --check web/studio-tasks.js
          node --check web/studio-tasks-ui.js
          node scripts/test-studio-tasks.mjs
          node scripts/test-studio-workflow-revision.mjs
          node --check web/studio-lab.js
          node --check web/studio-lab-ui.js
          node --check web/studio-astrology.js
          node --check web/studio-astrology-ui.js
          node --check web/studio-sky.js
          node --check web/studio-sky-ui.js
          node --check web/table-core.js
          node --check web/studio-quality-ui.js
          node scripts/test-studio-quality.mjs
          node scripts/test-studio-retrieval-quality.mjs
          node scripts/test-analysis-group-completeness.mjs
          node scripts/test-analysis-numeric-boundaries.mjs
          node scripts/test-analysis-empty-records.mjs
          node scripts/test-analysis-json-keys.mjs
          node scripts/test-studio-sky.mjs
          node scripts/test-studio-astrology.mjs
          node scripts/test-studio-core.mjs
          node scripts/test-studio-draft-review.mjs
          node scripts/test-studio-answer-review.mjs
          node scripts/test-studio-reference-audit.mjs
          node scripts/test-studio-memory-review.mjs
          node scripts/test-studio-memory-edits.mjs
          node scripts/test-studio-workflow-outcome.mjs
          node scripts/test-studio-workflow-review.mjs
          node scripts/test-studio-chat-review-matrix.mjs
          node scripts/test-studio-experience-archive.mjs
          node scripts/test-studio-experience-archive-recall.mjs
          node scripts/test-studio-chat-correction-options.mjs
          node scripts/test-studio-memory-dates.mjs
          node scripts/test-studio-memory-vectors.mjs
          node scripts/test-studio-memory-hybrid.mjs
          node scripts/test-studio-chat-attachments.mjs
          node scripts/test-studio-source-imports.mjs
          node scripts/test-studio-storage.mjs
          node scripts/test-studio-vault-cancellation.mjs
          node scripts/test-studio-lab.mjs
          node scripts/test-studio-workflow-critique.mjs
      - name: Reject ambiguous JSON fields and clear stale analysis in real downloads
        run: python3 scripts/test-studio-json-keys-browser.py
      - name: Exercise all-missing CSV and TSV records in real downloads
        run: python3 scripts/test-studio-empty-records-browser.py
      - name: Exercise exact JSON identifier and numeric range boundaries
        run: python3 scripts/test-studio-numeric-boundaries-browser.py
      - name: Exercise complete group exports and early analysis cancellation
        run: python3 scripts/test-studio-group-reports-browser.py
      - name: Exercise atomic source batches and isolated late file completions
        run: python3 scripts/test-studio-source-imports-browser.py
      - name: Exercise retained locale packs and asynchronous language imports
        run: python3 scripts/test-studio-locales-browser.py
      - name: Exercise archive corruption and transaction recovery in real IndexedDB
        run: python3 scripts/test-studio-storage-browser.py
      - name: Exercise destructive cancellation and stale archive completions
        run: python3 scripts/test-studio-archive-races-browser.py
      - name: Exercise vault cancellation, hidden key adoption and stale restore reads
        run: python3 scripts/test-studio-vault-cancellation-browser.py
      - name: Exercise Studio in disposable narrow and wide Chromium
        run: python3 scripts/test-studio-browser.py
      - name: Reject wrong or missing model route receipts in isolated Chromium
        run: python3 scripts/test-studio-model-receipt-browser.py
      - name: Explain synthetic gateway HTTP, network and malformed errors in isolated Chromium
        run: python3 scripts/test-studio-gateway-errors-browser.py
      - name: Review probable credentials with separate consent in isolated Chromium
        run: python3 scripts/test-studio-credential-preflight-browser.py
      - name: Verify storage status separates encrypted archive, unsaved drafts and local media in Chromium
        run: python3 scripts/test-studio-storage-status-browser.py
      - name: Confirm private music prompts and form-only drafts are cleared after user consent in Chromium
        run: python3 scripts/test-studio-private-draft-forms-browser.py
      - name: Verify unsaved local Music and Orchestra work is protected by user consent in Chromium
        run: python3 scripts/test-studio-unsaved-audio-browser.py
      - name: Reject delayed private vocal reads and playback after clear or lock in real Chromium
        run: python3 scripts/test-studio-vocal-races-browser.py
      - name: Prove private Studio lock and archive erasure revoke local vocal and music state in Chromium
        run: python3 scripts/test-studio-private-lifecycle-browser.py
      - name: Exercise opt-in vision review, image data disposal and text-only receipt in Chromium
        run: python3 scripts/test-studio-vision-browser.py
      - name: Exercise direct chat-file context, explicit model consent and private attachment cleanup
        run: python3 scripts/test-studio-chat-attachments-browser.py
      - name: Exercise selected research, code and data result handoffs into reviewed chat
        run: python3 scripts/test-studio-chat-tool-handoff-browser.py
      - name: Exercise opt-in astrology and encrypted profile lifecycle
        run: python3 scripts/test-studio-astrology-browser.py
      - name: Exercise offline sky computation and general presentation
        run: python3 scripts/test-studio-sky-browser.py
      - name: Exercise integrated data, recovery and keyboard workflow
        run: python3 scripts/test-studio-quality-browser.py
      - name: Exercise actual isolated code and local network sentinel
        run: python3 scripts/test-studio-lab-browser.py
      - name: Capture synthetic empty Studio layout for review
        run: |
          chrome="$(command -v google-chrome || command -v chromium)"
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage --no-first-run --hide-scrollbars --screenshot=studio-narrow.png --window-size=420,1000 "file://${PWD}/web/studio.html"
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage --no-first-run --hide-scrollbars --screenshot=studio-wide.png --window-size=1280,1000 "file://${PWD}/web/studio.html"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: studio-synthetic-layout-review
          path: studio-*.png
          retention-days: 7

name: NEXUS v2.3 Revocation Freshness Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify revocation freshness contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./scripts/v2.3-revocation-freshness-verification.sh
          bash ./scripts/v2.3-revocation-freshness-verification.sh

      - name: Build exact-candidate evidence
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-v2.3
          cp Cargo.lock src/authorized.rs src/capability.rs src/executor.rs docs/V2.3-REVOCATION-FRESHNESS.md scripts/v2.3-revocation-freshness-verification.sh evidence-v2.3/
          cat > evidence-v2.3/manifest.txt <<EOF
          schema=nexus.v2.3.revocation-freshness.v1
          status=PASS
          candidate_sha=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          authority_rule=A_child<=A_parent<=A_in
          stale_authorization_fail_closed=true
          revocation_epoch_derived_from_validated_history=true
          older_epoch_rejected=true
          newer_epoch_rejected=true
          equal_epoch_divergent_history_rejected=true
          reauthorization_required_after_epoch_transition=true
          durable_storage_claim=false
          distributed_consensus_claim=false
          cryptographic_authenticity_claim=false
          production_mutation=false
          authority_expansion=NONE
          EOF
          (cd evidence-v2.3 && sha256sum Cargo.lock authorized.rs capability.rs executor.rs V2.3-REVOCATION-FRESHNESS.md v2.3-revocation-freshness-verification.sh manifest.txt > SHA256SUMS)
          tar -czf nexus-v2.3-revocation-freshness-evidence.tar.gz evidence-v2.3

      - name: Upload exact-candidate evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nexus-v2.3-revocation-freshness-evidence
          path: |
            nexus-v2.3-revocation-freshness-evidence.tar.gz
            evidence-v2.3/manifest.txt
            evidence-v2.3/SHA256SUMS
          if-no-files-found: error

      - name: Attest exact-candidate evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: nexus-v2.3-revocation-freshness-evidence.tar.gz

name: Root Lockfile Refresh

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUST_IMAGE: rust@sha256:0ff31c9ffa641a62e48d543fb00b4960955ea375f40776f40f585b89e654cc5e

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Generate root Cargo.lock in pinned image
        run: |
          set -euo pipefail
          docker pull "$RUST_IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "$RUST_IMAGE" sh -euxc 'cargo generate-lockfile'
          test -s Cargo.lock
      - name: Upload root Cargo.lock candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: root-cargo-lock-candidate
          path: Cargo.lock
          if-no-files-found: error

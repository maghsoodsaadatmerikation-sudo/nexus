name: NEXUS Stage D Guarded OCI Image — Synthetic Only
on:
  pull_request:
    paths:
      - 'deploy/Dockerfile.stage-d-guarded-synthetic'
      - 'scripts/stage-d-guarded-image-entrypoint.py'
      - 'scripts/test-stage-d-guarded-container.py'
      - 'scripts/stage-d-oci-image-evidence.py'
      - 'scripts/test-stage-d-oci-image-evidence.py'
      - 'scripts/stage-d-signed-oci-admission.py'
      - 'scripts/test-stage-d-signed-oci-admission.py'
      - 'scripts/stage-d-two-reviewer-admission.py'
      - 'scripts/test-stage-d-two-reviewer-admission.py'
      - 'scripts/stage-d-ci-dual-review-demo.py'
      - 'scripts/workspace-stage-d-startup-guard.py'
      - 'scripts/workspace-stage-d-data-rollback-screen.py'
      - 'docs/STAGE-D-GUARDED-OCI-IMAGE.md'
      - 'docs/STAGE-D-OCI-BUILD-EVIDENCE.md'
      - 'docs/STAGE-D-SIGNED-OCI-ADMISSION.md'
      - '.github/workflows/stage-d-guarded-container.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/Dockerfile.stage-d-guarded-synthetic'
      - 'scripts/stage-d-guarded-image-entrypoint.py'
      - 'scripts/test-stage-d-guarded-container.py'
      - 'scripts/stage-d-oci-image-evidence.py'
      - 'scripts/test-stage-d-oci-image-evidence.py'
      - 'scripts/stage-d-signed-oci-admission.py'
      - 'scripts/test-stage-d-signed-oci-admission.py'
      - 'scripts/stage-d-two-reviewer-admission.py'
      - 'scripts/test-stage-d-two-reviewer-admission.py'
      - 'scripts/stage-d-ci-dual-review-demo.py'
      - '.github/workflows/stage-d-guarded-container.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test-synthetic-guarded-image:
    runs-on: ubuntu-24.04
    env:
      APPROVED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 23
    steps:
      - name: Check out exact PR commit and full history without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact historical baseline inside a new guarded OCI image
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_CHECKOUT_SHA"
          python3 -B -m py_compile scripts/stage-d-guarded-image-entrypoint.py scripts/test-stage-d-guarded-container.py
          python3 -B -m py_compile scripts/stage-d-oci-image-evidence.py scripts/test-stage-d-oci-image-evidence.py
          python3 -B scripts/test-stage-d-oci-image-evidence.py
          python3 -B scripts/test-stage-d-signed-oci-admission.py
          python3 -B -m py_compile scripts/stage-d-two-reviewer-admission.py scripts/test-stage-d-two-reviewer-admission.py scripts/stage-d-ci-dual-review-demo.py
          python3 -B scripts/test-stage-d-two-reviewer-admission.py
          revision=f4d027bb5f7e715b298f7cf7184fa621a2fb071d
          git cat-file -e "${revision}^{commit}"
          scratch="$(mktemp -d "${RUNNER_TEMP:-/tmp}/nexus-guarded-oci-XXXXXXXX")"
          trap 'git worktree remove --force "$scratch/historical-src" >/dev/null 2>&1 || :; rm -rf "$scratch"' EXIT
          git worktree add --detach "$scratch/historical-src" "$revision"
          test "$(git -C "$scratch/historical-src" rev-parse HEAD)" = "$revision"
          mkdir -p "$scratch/historical-src/scripts"
          for path in \
            stage-d-guarded-image-entrypoint.py \
            workspace-stage-d-startup-guard.py \
            workspace-stage-d-data-rollback-screen.py \
            workspace-stage-d-upgrade-rehearsal.py \
            workspace-stage-d-deploy-coherence.py \
            workspace-stage-d-railway-preflight.py \
            workspace-trust.py \
            workspace-attestation.py \
            data-snapshot.py
          do
            cp "scripts/$path" "$scratch/historical-src/scripts/$path"
          done
          docker build --progress=plain \
            -f deploy/Dockerfile.stage-d-guarded-synthetic \
            -t nexus-stage-d-guarded-synthetic:ci \
            "$scratch/historical-src"
          python3 -B scripts/test-stage-d-guarded-container.py \
            --synthetic-only \
            --image nexus-stage-d-guarded-synthetic:ci \
            --runner-temp "$scratch"
          evidence_root="${RUNNER_TEMP}/nexus-synthetic-oci-evidence-${APPROVED_CHECKOUT_SHA}"
          mkdir -m 0700 "$evidence_root"
          python3 -B scripts/stage-d-oci-image-evidence.py capture \
            --image nexus-stage-d-guarded-synthetic:ci \
            --commit "$APPROVED_CHECKOUT_SHA" \
            --review-root "$PWD" \
            --build-root "$scratch/historical-src" \
            --dockerfile "$PWD/deploy/Dockerfile.stage-d-guarded-synthetic" \
            --evidence "$evidence_root/manifest.json" \
            --sbom "$evidence_root/sbom.cdx.json"
          sha256sum "$evidence_root/manifest.json" "$evidence_root/sbom.cdx.json" \
            > "$evidence_root/local-checksums.sha256"
          expected="$(sha256sum "$evidence_root/manifest.json" | cut -d' ' -f1)"
          python3 -B scripts/stage-d-oci-image-evidence.py verify \
            --image nexus-stage-d-guarded-synthetic:ci \
            --commit "$APPROVED_CHECKOUT_SHA" \
            --expected-sha256 "$expected" \
            --evidence "$evidence_root/manifest.json" \
            --sbom "$evidence_root/sbom.cdx.json"
          if python3 -B scripts/stage-d-oci-image-evidence.py release-gate \
            --commit "$APPROVED_CHECKOUT_SHA" \
            --expected-sha256 "$expected" \
            --evidence "$evidence_root/manifest.json" \
            --sbom "$evidence_root/sbom.cdx.json"; then
              echo 'ERROR: synthetic image evidence improperly granted production release' >&2
              exit 1
          fi
          # Ephemeral demo reviewer key is created only on this CI runner.
          # The PRIVATE key is deliberately OUTSIDE the uploaded artifact.
          # This signature proves crypto plumbing only, NOT independent custody.
          demo_private="$scratch/ci-demo-private-ed25519.pem"
          openssl genpkey -algorithm Ed25519 -out "$demo_private"
          chmod 0600 "$demo_private"
          demo_public="$evidence_root/ci-demo-public-ed25519.pem"
          openssl pkey -in "$demo_private" -pubout -out "$demo_public"
          demo_public_der_sha="$(openssl pkey -pubin -in "$demo_public" -outform DER | sha256sum | cut -d' ' -f1)"
          sbom_sha="$(sha256sum "$evidence_root/sbom.cdx.json" | cut -d' ' -f1)"
          local_image_id="$(docker image inspect --format '{{.Id}}' nexus-stage-d-guarded-synthetic:ci)"
          python3 -B scripts/stage-d-signed-oci-admission.py sign-synthetic \
            --manifest "$evidence_root/manifest.json" \
            --sbom "$evidence_root/sbom.cdx.json" \
            --reviewed-commit "$APPROVED_CHECKOUT_SHA" \
            --expected-manifest-sha256 "$expected" \
            --expected-sbom-sha256 "$sbom_sha" \
            --local-image-id "$local_image_id" \
            --reviewer-key-id ci-demo-ephemeral \
            --public-key "$demo_public" \
            --public-key-der-sha256 "$demo_public_der_sha" \
            --private-key "$demo_private" \
            --signed-review "$evidence_root/ci-demo-signed-review.json"
          demo_signed_sha="$(sha256sum "$evidence_root/ci-demo-signed-review.json" | cut -d' ' -f1)"
          python3 -B scripts/stage-d-signed-oci-admission.py verify \
            --manifest "$evidence_root/manifest.json" \
            --sbom "$evidence_root/sbom.cdx.json" \
            --reviewed-commit "$APPROVED_CHECKOUT_SHA" \
            --expected-manifest-sha256 "$expected" \
            --expected-sbom-sha256 "$sbom_sha" \
            --local-image-id "$local_image_id" \
            --reviewer-key-id ci-demo-ephemeral \
            --public-key "$demo_public" \
            --public-key-der-sha256 "$demo_public_der_sha" \
            --signed-review "$evidence_root/ci-demo-signed-review.json" \
            --expected-signed-sha256 "$demo_signed_sha"
          printf '%s\n' "$demo_public_der_sha" > "$evidence_root/ci-demo-public-der-sha256.txt"
          sha256sum "$demo_public" "$evidence_root/ci-demo-public-der-sha256.txt" \
            "$evidence_root/ci-demo-signed-review.json" >> "$evidence_root/local-checksums.sha256"
          # A second DISPOSABLE reviewer key signs the same REAL Docker
          # manifest in this CI job. Two CI keys are not two custodians.
          python3 -B scripts/stage-d-ci-dual-review-demo.py \
            --synthetic-only \
            --reviewed-commit "$APPROVED_CHECKOUT_SHA" \
            --evidence-root "$evidence_root"
          sha256sum "$evidence_root"/ci-demo-dual-*.json \
            "$evidence_root"/ci-demo-recovery-*.pem \
            "$evidence_root"/ci-demo-recovery-*.json \
            >> "$evidence_root/local-checksums.sha256"
          echo 'DEMO DUAL REVIEW ONLY: no independent custodians or release authorization'
          echo 'OCI IMAGE TEST ONLY: no registry publish, no Railway/Render deployment'
      - name: Retain unsigned synthetic build manifest and partial SBOM for review
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-synthetic-oci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nexus-synthetic-oci-evidence-${{ github.event.pull_request.head.sha || github.sha }}/
          if-no-files-found: error
          retention-days: 7

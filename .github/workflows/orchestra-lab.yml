name: NEXUS Orchestra & Vocal Lab — Original Offline Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/orchestra-lab.yml'
      - 'web/studio-orchestra.js'
      - 'web/studio-orchestra-ui.js'
      - 'web/studio-shell.html'
      - 'web/studio-focus-ui.js'
      - 'web/studio.html'
      - 'public/studio/index.html'
      - 'public/studio/service-worker.js'
      - 'scripts/build-studio.py'
      - 'scripts/test-studio-orchestra.mjs'
      - 'scripts/test-studio-orchestra-browser.py'
      - 'docs/NEXUS-ORCHESTRA-VOCAL-LAB.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/orchestra-lab.yml'
      - 'web/studio-orchestra.js'
      - 'web/studio-orchestra-ui.js'
      - 'web/studio-shell.html'
      - 'web/studio-focus-ui.js'
      - 'web/studio.html'
      - 'public/studio/index.html'
      - 'public/studio/service-worker.js'
      - 'scripts/build-studio.py'
      - 'scripts/test-studio-orchestra.mjs'
      - 'scripts/test-studio-orchestra-browser.py'
      - 'docs/NEXUS-ORCHESTRA-VOCAL-LAB.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-local-orchestra:
    name: exact notation and intact vocal acceptance (synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout reviewed head without write credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Compile-check and exercise strict prompt and score contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check web/studio-orchestra.js
          node --check web/studio-orchestra-ui.js
          node scripts/test-studio-orchestra.mjs
      - name: Exact deterministic Studio and integrity-pinned offline package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-studio.py --check
          python3 scripts/build-studio-static.py --check
      - name: Real offline narrow Chromium file import/export and notation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-studio-orchestra-browser.py
